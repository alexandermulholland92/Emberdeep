name: build-vpk

on:
  push:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure vitaGL and a host compiler are present
        shell: bash
        run: |
          set -eu
          need_apt=0
          command -v cc  >/dev/null 2>&1 || need_apt=1
          command -v git >/dev/null 2>&1 || need_apt=1
          if [ "$need_apt" = "1" ]; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential git
          fi
          if [ -f "$VITASDK/arm-vita-eabi/lib/libvitaGL.a" ]; then
            echo "vitaGL already in the image"
          else
            echo "vitaGL missing, building it from source"
            git clone --depth 1 https://github.com/Rinnegatamante/vitaGL /tmp/vitaGL
            make -C /tmp/vitaGL -j"$(nproc)" install
          fi

      - name: Verify game logic
        run: |
          make check
          make test

      - name: Build the VPK
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: emberdeep-vpk
          path: emberdeep.vpk
          if-no-files-found: error

      - name: Show toolchain versions on failure
        if: failure()
        run: |
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version || true
          ls -la "$VITASDK/arm-vita-eabi/lib" | head -40 || true
