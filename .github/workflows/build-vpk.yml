# Builds emberdeep.vpk in the cloud and attaches it to the run.
# Works whether the project sits at the repo root or inside a subfolder.
name: build-vpk

on:
  push:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest      # Ubuntu based; VITASDK is already on PATH

    steps:
      - uses: actions/checkout@v4

      # the upload may have nested everything one folder deep, so go find it
      - name: Locate the project
        id: loc
        shell: bash
        run: |
          set -eu
          if [ -f Makefile ]; then
            dir="."
          else
            mk=$(find . -maxdepth 3 -name Makefile -not -path "*/vitaGL/*" | head -n 1)
            if [ -z "$mk" ]; then
              echo "No Makefile anywhere in this repo - are the files uploaded?"
              ls -la
              exit 1
            fi
            dir=$(dirname "$mk")
          fi
          echo "project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Ensure vitaGL and a host compiler are present
        shell: bash
        run: |
          set -eu
          need_apt=0
          command -v cc  >/dev/null 2>&1 || need_apt=1
          command -v git >/dev/null 2>&1 || need_apt=1
          if [ "$need_apt" = "1" ]; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential git
          fi
          if [ -f "$VITASDK/arm-vita-eabi/lib/libvitaGL.a" ]; then
            echo "vitaGL already in the image"
          else
            echo "vitaGL missing, building it from source"
            git clone --depth 1 https://github.com/Rinnegatamante/vitaGL /tmp/vitaGL
            make -C /tmp/vitaGL -j"$(nproc)" install
          fi

      # catch invented GL calls before the compiler does, with a clearer message
      - name: Check GL symbols against the installed vitaGL
        working-directory: ${{ steps.loc.outputs.dir }}
        shell: bash
        run: |
          hdr=$(find "$VITASDK" -name vitaGL.h 2>/dev/null | head -n 1)
          if [ -z "$hdr" ]; then echo "vitaGL.h not found; skipping"; exit 0; fi
          echo "checking against $hdr"
          miss=0
          for s in $(grep -ohE "\b(v?gl[A-Z][A-Za-z0-9_]*)[[:space:]]*\(" src/render.c src/texture.c \
                     | tr -d '( ' | sort -u); do
            grep -qE "\b$s\b" "$hdr" || { echo "NOT IN vitaGL: $s"; miss=1; }
          done
          if [ "$miss" = "0" ]; then echo "all GL symbols present"; fi
          exit $miss

      # make check compiles src/ against tests/stubs/, so a stub that
      # disagrees with the SDK makes it agree with nothing
      - name: Check the host stubs against the SDK headers
        working-directory: ${{ steps.loc.outputs.dir }}
        shell: bash
        run: sh tools/check_stubs.sh

      # the simulation is platform independent, so it can be checked here too
      - name: Verify game logic
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          make check
          make test

      - name: Build the VPK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: emberdeep-vpk
          path: ${{ steps.loc.outputs.dir }}/emberdeep.vpk
          if-no-files-found: error

      # if the build breaks, this makes the log easy to copy back for a fix
      - name: Show toolchain versions on failure
        if: failure()
        shell: bash
        run: |
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version || true
          ls -la "$VITASDK/arm-vita-eabi/lib" | head -40 || true
