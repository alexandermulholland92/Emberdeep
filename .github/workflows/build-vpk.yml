name: build-vpk

on:
  push:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Locate the project
        id: loc
        shell: bash
        run: |
          set -eu
          if [ -f Makefile ]; then
            dir="."
          else
            mk=$(find . -maxdepth 3 -name Makefile -not -path "*/vitaGL/*" | head -n 1)
            if [ -z "$mk" ]; then
              echo "No Makefile anywhere in this repo - are the files uploaded?"
              ls -la
              exit 1
            fi
            dir=$(dirname "$mk")
          fi
          echo "project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Ensure vitaGL and dependencies are present
        shell: bash
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends build-essential git cmake ca-certificates
          
          if [ -f "$VITASDK/arm-vita-eabi/lib/libvitaGL.a" ]; then
            echo "vitaGL already in the image"
          else
            echo "vitaGL missing, building it and its dependencies via vdpm..."
            git clone https://github.com/vitasdk/vdpm /tmp/vdpm
            cd /tmp/vdpm
            ./bootstrap-vitasdk.sh
            
            # This automatically builds math-neon, vitashark, and vitaGL
            make vitagl 
          fi

      - name: Verify game logic
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          make check
          make test

      - name: Build the VPK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: emberdeep-vpk
          path: ${{ steps.loc.outputs.dir }}/*.vpk
