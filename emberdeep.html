  player: null, enemies: [], projectiles: [], traps: [], pickups: [], timers: [],
  boss: null, currentRoom: null, elapsed: 0, kills: 0, mmTimer: 0, transitioning: false
};

function schedule(delay, fn) { G.timers.push({ t: delay, fn: fn }); }
function updateTimers(dt) {
  // a callback (floor transition) can replace G.timers mid-loop, so iterate a
  // stable reference and only splice while it is still the live array
  var list = G.timers;
  for (var i = list.length - 1; i >= 0; i--) {
    var t = list[i];
    if (!t) continue;
    t.t -= dt;
    if (t.t <= 0) {
      if (G.timers === list) list.splice(i, 1);
      t.fn();
    }
  }
}

// ---------- status effects ----------
function newStatus() {
  return { stun: 0, slow: 0, slowAmt: 0, burn: 0, burnDps: 0, pois: 0, poisDps: 0, dotTick: 0 };
}
function applyStatus(ent, kind, dur, val) {
  var s = ent.status;
  if (kind === 'stun') s.stun = Math.max(s.stun, dur);
  else if (kind === 'slow') { s.slow = Math.max(s.slow, dur); s.slowAmt = Math.max(s.slowAmt, val); }
  else if (kind === 'burn') { s.burn = Math.max(s.burn, dur); s.burnDps = Math.max(s.burnDps, val); }
  else if (kind === 'pois') { s.pois = Math.max(s.pois, dur); s.poisDps = Math.max(s.poisDps, val); }
}
function tickStatus(ent, dt, isPlayer) {
  var s = ent.status;
  s.stun = Math.max(0, s.stun - dt);
  s.slow = Math.max(0, s.slow - dt);
  if (s.slow === 0) s.slowAmt = 0;
  s.burn = Math.max(0, s.burn - dt);
  s.pois = Math.max(0, s.pois - dt);
  s.dotTick -= dt;
  if (s.dotTick <= 0) {
    s.dotTick = 0.5;
    if (s.burn > 0) {
      var b = Math.max(1, Math.round(s.burnDps * 0.5));
      if (isPlayer) { hurtPlayer(b, true); } else { hurtEnemy(ent, b, { silent: true, dot: 'burn' }); }
    }
    if (s.pois > 0) {
      var p = Math.max(1, Math.round(s.poisDps * 0.5));
      if (isPlayer) { hurtPlayer(p, true); } else { hurtEnemy(ent, p, { silent: true, dot: 'pois' }); }
    }
  }
  if (s.burn > 0 && Math.random() < dt * 12) {
    burst(ent.obj.position.clone().setY(0.9), 1, { type: 'fire', speed: 0.5, size: 0.06, life: 0.4, grav: -1 });
  }
  if (s.pois > 0 && Math.random() < dt * 10) {
    burst(ent.obj.position.clone().setY(0.7), 1, { type: 'venom', speed: 0.4, size: 0.06, life: 0.5, grav: -0.6 });
  }
}
function speedMult(ent) {
  if (ent.status.stun > 0) return 0;
  return 1 - ent.status.slowAmt;
}

// ---------- targeting helpers ----------
function liveEnemies() {
  var out = [];
  for (var i = 0; i < G.enemies.length; i++) {
    var e = G.enemies[i];
    if (e.alive && !e.dying) out.push(e);
  }
  return out;
}
function enemiesInRadius(pos, r) {
  var out = [], list = liveEnemies();
  for (var i = 0; i < list.length; i++) {
    if (dist2D(list[i].obj.position, pos) <= r + list[i].hitR) out.push(list[i]);
  }
  return out;
}
function damageArea(pos, radius, dmg, opts) {
  opts = opts || {};
  var hit = enemiesInRadius(pos, radius);
  for (var i = 0; i < hit.length; i++) {
    var roll = rollDamage(dmg);
    hurtEnemy(hit[i], roll.amount, { crit: roll.crit });
    if (opts.stun) applyStatus(hit[i], 'stun', opts.stun);
    if (opts.slow) applyStatus(hit[i], 'slow', opts.slow, opts.slowAmt || 0.5);
    if (opts.burn) applyStatus(hit[i], 'burn', opts.burn, opts.burnDps || 4);
    if (opts.pois) applyStatus(hit[i], 'pois', opts.pois, opts.poisDps || 4);
    if (opts.knock) knockback(hit[i], pos, opts.knock);
  }
  return hit.length;
}
function coneHit(origin, facing, range, spread, dmg, opts) {
  opts = opts || {};
  var list = liveEnemies(), n = 0;
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    var dx = e.obj.position.x - origin.x, dz = e.obj.position.z - origin.z;
    var d = Math.sqrt(dx * dx + dz * dz);
    if (d > range + e.hitR) continue;
    var ang = Math.atan2(dx, dz);
    var diff = Math.abs(Math.atan2(Math.sin(ang - facing), Math.cos(ang - facing)));
    if (diff > spread / 2) continue;
    var roll = rollDamage(dmg);
    hurtEnemy(e, roll.amount, { crit: roll.crit });
    if (opts.stun) applyStatus(e, 'stun', opts.stun);
    if (opts.knock) knockback(e, origin, opts.knock);
    n++;
  }
  return n;
}
function knockback(ent, from, power) {
  var dx = ent.obj.position.x - from.x, dz = ent.obj.position.z - from.z;
  var len = Math.hypot(dx, dz) || 1;
  moveBody(ent.obj, dx / len * power, dz / len * power, ent.hitR);
}
function rollDamage(base) {
  var crit = Math.random() < 0.16;
  return { amount: Math.max(1, Math.round(crit ? base * 2 : base)), crit: crit };
}

// ---------- projectiles ----------
function spawnProjectile(o) {
  var g = new THREE.Group();
  var core = new THREE.Mesh(
    new THREE.SphereGeometry(o.radius || 0.2, 9, 7),
    new THREE.MeshBasicMaterial({ color: o.color })
  );
  g.add(core);
  var glow = new THREE.Mesh(
    new THREE.SphereGeometry((o.radius || 0.2) * 1.8, 9, 7),
    new THREE.MeshBasicMaterial({ color: o.color, transparent: true, opacity: 0.32 })
  );
  g.add(glow);
  g.position.copy(o.pos);
  scene.add(g);
  G.projectiles.push({
    obj: g, glow: glow, dir: o.dir.clone().normalize(), speed: o.speed || 12,
    dmg: o.dmg, from: o.from, dist: 0, maxDist: o.maxDist || 22,
    radius: (o.radius || 0.2) + 0.5, pierce: o.pierce || 0, hitSet: [],
    burn: o.burn || 0, splash: o.splash || 0, splashDmg: o.splashDmg || 0,
    color: o.color, trail: o.trail || 'fire', t: 0
  });
}
function updateProjectiles(dt) {
  spellLight.intensity = 0;
  for (var i = G.projectiles.length - 1; i >= 0; i--) {
    var p = G.projectiles[i];
    var step = p.speed * dt;
    p.obj.position.addScaledVector(p.dir, step);
    p.dist += step; p.t += dt;
    p.glow.scale.setScalar(1 + Math.sin(p.t * 22) * 0.14);

    if (p.from === 'player') {
      spellLight.position.copy(p.obj.position);
      spellLight.color.setHex(p.color);
      spellLight.intensity = 2.2;
    }
    if (Math.random() < dt * 40) {
      burst(p.obj.position, 1, { type: p.trail, speed: 0.4, size: 0.06, life: 0.28, grav: -0.5 });
    }

    var done = false;
    if (!isWalkable(p.obj.position.x, p.obj.position.z, 0.12) || p.dist > p.maxDist) done = true;

    if (!done && p.from === 'player') {
      var list = liveEnemies();
      for (var j = 0; j < list.length; j++) {
        var e = list[j];
        if (p.hitSet.indexOf(e.id) !== -1) continue;
        if (dist2D(p.obj.position, e.obj.position) < p.radius + e.hitR) {
          var roll = rollDamage(p.dmg);
          hurtEnemy(e, roll.amount, { crit: roll.crit });
          if (p.burn) applyStatus(e, 'burn', p.burn, 5);
          p.hitSet.push(e.id);
          if (p.splash) {
            damageArea(p.obj.position, p.splash, p.splashDmg, { burn: p.burn, burnDps: 5 });
            shockwave(p.obj.position, p.splash * 0.9, p.color, 0.45);
            shake(0.25);
          }
          if (p.pierce > 0) p.pierce--; else done = true;
          break;
        }
      }
    } else if (!done && p.from === 'enemy' && G.player.alive) {
      if (dist2D(p.obj.position, G.player.obj.position) < p.radius + G.player.radius) {
        hurtPlayer(p.dmg);
        if (p.burn) applyStatus(G.player, 'burn', p.burn, 4);
        done = true;
      }
    }

    if (done) {
      burst(p.obj.position, 10, { type: p.trail, speed: 2.6, size: 0.08, life: 0.4, grav: -2 });
      scene.remove(p.obj);
      G.projectiles.splice(i, 1);
    }
  }
}

// ---------- traps ----------
function spawnTrap(pos, dmg) {
  var mat = new THREE.MeshBasicMaterial({ color: 0xa8e05a, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
  var m = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.9, 20), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(pos.x, 0.12, pos.z);
  scene.add(m);
  G.traps.push({ mesh: m, mat: mat, pos: m.position.clone(), arm: 0.4, life: 22, dmg: dmg });
}
function updateTraps(dt) {
  for (var i = G.traps.length - 1; i >= 0; i--) {
    var t = G.traps[i];
    t.arm -= dt; t.life -= dt;
    t.mesh.rotation.z += dt * 0.9;
    t.mat.opacity = 0.35 + Math.sin(G.elapsed * 5) * 0.15;
    var trigger = false;
    if (t.arm <= 0) {
      var near = enemiesInRadius(t.pos, 1.9);
      if (near.length) trigger = true;
    }
    if (trigger || t.life <= 0) {
      if (trigger) {
        damageArea(t.pos, 2.7, t.dmg, { pois: 6, poisDps: 6, slow: 2.5, slowAmt: 0.35 });
        shockwave(t.pos, 3, 0xa8e05a, 0.5);
        burst(t.pos.clone().setY(0.4), 26, { type: 'venom', speed: 3, size: 0.09, life: 0.8 });
        shake(0.2);
      }
      scene.remove(t.mesh); t.mat.dispose(); t.mesh.geometry.dispose();
      G.traps.splice(i, 1);
    }
  }
}

// ---------- pickups ----------
function spawnPickup(pos) {
  var g = new THREE.Group();
  var glass = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 9, 7),
    new THREE.MeshBasicMaterial({ color: 0xff5a6a })
  );
  glass.position.y = 0.4; g.add(glass);
  var neck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 0.14, 6),
    new THREE.MeshBasicMaterial({ color: 0xd8cbb0 })
  );
  neck.position.y = 0.57; g.add(neck);
  g.position.set(pos.x, 0, pos.z);
  scene.add(g);
  G.pickups.push({ obj: g, t: rand(0, 6), pos: g.position });
}
function updatePickups(dt) {
  for (var i = G.pickups.length - 1; i >= 0; i--) {
    var p = G.pickups[i];
    p.t += dt;
    p.obj.position.y = Math.sin(p.t * 2.5) * 0.09;
    p.obj.rotation.y += dt * 1.6;
    if (dist2D(p.obj.position, G.player.obj.position) < 1.0) {
      var heal = Math.round(G.player.maxHp * 0.32);
      G.player.hp = Math.min(G.player.maxHp, G.player.hp + heal);
      popNumber(G.player.obj.position, '+' + heal, 'heal');
      burst(G.player.obj.position.clone().setY(0.8), 16, { type: 'heal', speed: 1.6, grav: 1, life: 0.7, size: 0.07 });
      flash(el.healFlash, 130);
      scene.remove(p.obj);
      G.pickups.splice(i, 1);
    }
  }
}

// ---------- animation ----------
function animateActor(ent, dt, moving) {
  var ud = ent.obj.userData;
  var baseY = ent.baseY || 0;

  // how fast and which way the actor is really going, read off its own
  // motion: the stride keeps pace with the ground, and plays in reverse for
  // an actor backing away while it still faces forward (over 120 degrees
  // off, so one still turning to face its path does not shuffle to and fro)
  var pos = ent.obj.position;
  if (ent.gaitX === undefined) { ent.gaitX = pos.x; ent.gaitZ = pos.z; }
  var sdx = pos.x - ent.gaitX, sdz = pos.z - ent.gaitZ, sd = Math.hypot(sdx, sdz);
  ent.gaitX = pos.x; ent.gaitZ = pos.z;
  ent.gaitSpeed = dt > 0 ? sd / dt : 0;
  var yaw = ent.obj.rotation.y;
  if (moving && sdx * Math.sin(yaw) + sdz * Math.cos(yaw) < -0.5 * sd) moving = -1;
  var amp = moving ? 1 : 0.05;

  // ---- locomotion ----
  if (ud.float) {
    ent.floatT += dt * 2.2;
    ent.obj.position.y = baseY + Math.sin(ent.floatT) * 0.15;
    if (ud.wings) {
      var f = Math.sin(ent.floatT * 7) * 0.8;
      if (ud.wings[0]) ud.wings[0].rotation.z = 0.25 + f;
      if (ud.wings[1]) ud.wings[1].rotation.z = -0.25 - f;
    }
    // legs trail back as it flies, knees folded the way knees fold
    for (var li = 0; li < ud.legs.length; li++) {
      var dl = ud.legs[li];
      dl.hip.rotation.x = 0.3 + Math.sin(ent.floatT + li) * 0.12;
      if (dl.knee) dl.knee.rotation.x = 0.45;
    }
  } else if (ud.kind === 'arachnid') {
    ent.walkT += dt * (moving ? 15 : 2);
    ent.obj.position.y = baseY + Math.abs(Math.sin(ent.walkT * 2)) * 0.028;
    for (var ai = 0; ai < ud.legs.length; ai++) {
      var al = ud.legs[ai];
      var ph = ent.walkT + ai * 0.85;
      al.hip.rotation.z = (al.rest || 0) + Math.sin(ph) * 0.22 * amp;
      al.hip.rotation.x = Math.cos(ph) * 0.2 * amp;
    }
  } else {
    // biped / quadruped stride (see stridePose). Rigs face +z and a positive
    // x rotation swings a limb's far end backwards, so a leg swings forward
    // while cos(phase) < 0 and is planted while cos(phase) > 0. The body
    // settles onto whichever foot is lowest, so it dips as the legs spread
    // and rides highest over a straight planted leg.
    if (ent.stride === undefined) measureStride(ent);
    var rate = ud.kind === 'quad' ? 11 : 8.5;
    var lock = 1e9;
    ent.stride = approach(ent.stride, moving ? 1 : 0.05, dt * 12);

    // step as fast as the ground goes by: one cycle has to cover exactly
    // the ground the actor moves, or the planted foot skates (a shorter
    // stride while it is still getting going covers proportionally less)
    ent.pace = approach(ent.pace, moving ? ent.gaitSpeed : 0, dt * 10);
    if (moving && ent.pace > 0 && ent.cycle > 0)
      rate = ent.pace * Math.PI * 2
           / (ent.cycle * ent.obj.scale.y * Math.max(ent.stride, 0.25));
    rate = Math.min(Math.max(rate, 2.2), 24);
    ent.walkT += dt * (moving ? rate : 2.2) * (moving < 0 ? -1 : 1);

    for (var j = 0; j < ud.legs.length; j++) {
      var leg = ud.legs[j];
      var phase = ud.kind === 'quad'
        ? ent.walkT + ((j === 0 || j === 3) ? 0 : Math.PI)   // diagonal gait
        : ent.walkT + (j ? Math.PI : 0);
      var sp = stridePose(phase, ent.stride);
      leg.hip.rotation.x = sp.hip;
      leg.knee.rotation.x = sp.knee;
      // the ankle undoes the leg's slope, so a planted foot is flat
      if (ent.gaitFeet[j]) ent.gaitFeet[j].rotation.x = sp.tilt - sp.hip - sp.knee;
      lock = Math.min(lock, footContact(ent, sp.hip, sp.knee, sp.tilt, null));
    }
    if (!ud.legs.length) lock = 0;
    // standing still keeps a gentle breathing bob
    var walking = (ent.stride - 0.05) / 0.95;
    ent.obj.position.y = baseY - lock * ent.obj.scale.y * walking
                       + Math.sin(ent.walkT) * 0.008 * (1 - walking);
    if (ud.chest) ud.chest.rotation.y = Math.sin(ent.walkT) * 0.11 * ent.stride;
  }

  // ---- off-hand arm counter-swings while walking ----
  // the off-hand is on leg 0's side, so it runs half a cycle behind that
  // leg to swing against it rather than with it
  var swingA = moving ? Math.sin(ent.walkT) * 0.42 : 0;
  if (ud.armL && !ent.telegraphing) {
    ud.armL.shoulder.rotation.x = approach(ud.armL.shoulder.rotation.x, -swingA, dt * 9);
    ud.armL.elbow.rotation.x = approach(ud.armL.elbow.rotation.x, -0.28 - Math.max(0, swingA) * 0.5, dt * 9);
  }
  // ---- cape and tail trail behind motion ----
  for (var ci = 0; ci < ud.capes.length; ci++) {
    if (!ud.capes[ci]) continue;
    ud.capes[ci].rotation.x = approach(ud.capes[ci].rotation.x,
      moving ? 0.42 + Math.sin(ent.walkT * 2) * 0.07 : 0.1, dt * 5);
  }
  if (ud.tail) {
    ud.tail.rotation.z = Math.sin(ent.walkT * 0.8) * 0.22 * (moving ? 1 : 0.35);
  }
  // ---- head settles toward level ----
  if (ud.headPivot && !ent.telegraphing) {
    ud.headPivot.rotation.x = approach(ud.headPivot.rotation.x, moving ? 0.08 : 0, dt * 6);
  }

  // ---- a boss's wind-up: haul the weapon up and lean back into it ----
  armInfo(ent);
  ent.lean = approach(ent.lean, ent.telegraphing ? -0.18 : 0, dt * 5);
  if (ud.chest && ud.armR) ud.chest.rotation.x = ent.chestX + ent.lean;
  if (ent.telegraphing) {
    if (ud.armR) {
      var ta = armAim(ent);
      armPose(ent, approach(ud.armR.shoulder.rotation.x, WIND[0], dt * 5),
              approach(ud.armR.elbow.rotation.x, WIND[1], dt * 5),
              approach(ta, WIND[2], dt * 5));
    }
    return;
  }

  // ---- weapon arm: wind up, then swing through ----
  if (ent.atkAnim > 0) {
    // a swing of whole frames ends on its last frame, however the float and
    // double builds round the time left
    ent.atkAnim -= dt;
    if (ent.atkAnim < 1e-4) ent.atkAnim = 0;
    var t = 1 - ent.atkAnim / ent.atkAnimDur;
    if (ud.armR) {
      var pose = [0, 0, 0], twist, k;
      if (t < 0.3) {
        // up and over the shoulder, easing in and out
        var u = t / 0.3;
        u = u * u * (3 - 2 * u);
        for (k = 0; k < 3; k++) pose[k] = ent.swingFrom[k] + (WIND[k] - ent.swingFrom[k]) * u;
        twist = 0.25 * u;                          // weapon shoulder draws back
      } else {
        // then the chop: fast off the top, slowing through the end
        var u2 = (t - 0.3) / 0.7, e = Math.sin(u2 * Math.PI * 0.5);
        var end = [STRIKE[0] + (ent.atkSwing - 1.4) * 0.6, STRIKE[1], STRIKE[2]];
        for (k = 0; k < 3; k++) pose[k] = WIND[k] + (end[k] - WIND[k]) * e;
        twist = (0.25 - 0.55 * e) * (1 - u2 * u2);  // and drives through
      }
      armPose(ent, pose[0], pose[1], pose[2]);
      if (ud.chest) ud.chest.rotation.y += twist;
    } else if (ud.body) {
      ud.body.position.z = Math.sin(t * Math.PI) * 0.42;   // beasts lunge instead
    }
  } else {
    if (ud.armR) {
      var ra = armAim(ent);
      armPose(ent, approach(ud.armR.shoulder.rotation.x, HOLD[0], dt * 11),
              approach(ud.armR.elbow.rotation.x, HOLD[1], dt * 11),
              approach(ra, HOLD[2], dt * 11));
    }
    if (ud.body) ud.body.position.z = approach(ud.body.position.z, 0, dt * 12);
  }
}

// ---------- the weapon arm ----------
// Its poses: shoulder, elbow, and where the weapon points (radians from
// straight up, toward the front). Rigs face +z, and a negative x rotation
// raises a limb forward. A weapon is carried angled up and ahead; a swing
// hauls it up over the shoulder until it points down the back, then chops
// it forward and down through whatever is in front.
var HOLD = [0, -0.45, 0.6];
var WIND = [-2.5, -1.2, -2.6];
var STRIKE = [-0.55, -0.15, 1.9];

// A weapon is a group hung from the right hand (a bare hand holds only
// meshes), mounted at a fixed angle the aim has to allow for.
function armInfo(ent) {
  if (ent.armed !== undefined) return;
  var ud = ent.obj.userData;
  ent.armed = false; ent.mount = 0; ent.lean = 0;
  ent.chestX = ud.chest ? ud.chest.rotation.x : 0;
  ent.swingFrom = HOLD.slice();
  if (ud.armR && ud.armR.hand) {
    var kids = ud.armR.hand.children;
    for (var i = 0; i < kids.length; i++) {
      if (!kids[i].isMesh) { ent.armed = true; ent.mount = kids[i].rotation.x; break; }
    }
  }
}
// where the weapon points now
function armAim(ent) {
  var r = ent.obj.userData.armR;
  return r.hand.rotation.x + r.shoulder.rotation.x + r.elbow.rotation.x + ent.mount;
}
// put the weapon arm in a pose: the wrist turns the weapon to its aim, and
// a bare hand keeps its wrist straight
function armPose(ent, sh, elb, aim) {
  var r = ent.obj.userData.armR;
  r.shoulder.rotation.x = sh;
  r.elbow.rotation.x = Math.min(0, elb);
  r.hand.rotation.x = ent.armed ? aim - sh - r.elbow.rotation.x - ent.mount : 0;
}
// ---------- the walk's shape ----------
var HIP_SWING = 0.55;   // thigh either side of vertical
var KNEE_FOLD = 0.85;   // knee at its most bent
var KNEE_LEAD = 0.3;    // how far ahead of the hip the knee runs
var TOE_DOWN = 0.35;    // foot tipped toe-down as it leaves the floor
var TOE_UP = 0.4;       // and toe-up as it comes down, heel first

// The thigh's swing through one cycle, -1 (forward) .. 1 (back). While the
// foot is planted - from the front of the stride round to the back - the
// thigh sweeps back at an even rate, so the foot travels back under the
// body at the same steady speed the body moves over it. The swing forward
// eases out and in.
function hipWave(phase) {
  var u = phase - Math.PI * 2 * Math.floor(phase / (Math.PI * 2));
  if (u < 0.5 * Math.PI) return u / (0.5 * Math.PI);
  if (u > 1.5 * Math.PI) return (u - 2 * Math.PI) / (0.5 * Math.PI);
  return Math.sin(u);
}

// One leg at `phase`: the hip, the knee, and the foot's pitch against the
// floor (positive tips the toe down). The knee folds the way a knee bends -
// shin back, heel up - and only while the leg swings through: it starts
// just before the foot leaves the floor, is most bent early in the swing,
// and is straight again before the foot reaches out to land. The foot stays
// flat while planted, trails toe-down for the first half of the swing, is
// level again by mid-swing so the toe clears the floor, and comes in toe-up
// to land on its heel - which is also what lets one foot take the weight
// exactly as the other lets it go.
function stridePose(phase, stride) {
  var u = phase - Math.PI * 2 * Math.floor(phase / (Math.PI * 2));
  var down = (u > 0.5 * Math.PI && u < Math.PI) ? Math.sin(2 * (u - 0.5 * Math.PI)) : 0;
  var up = Math.abs(u - 1.5 * Math.PI) < 0.25 * Math.PI ? Math.cos(2 * (u - 1.5 * Math.PI)) : 0;
  return {
    hip: hipWave(phase) * HIP_SWING * stride,
    knee: Math.max(0, -Math.cos(phase + KNEE_LEAD)) * KNEE_FOLD * stride,
    tilt: (down * TOE_DOWN - up * TOE_UP) * stride
  };
}

// A foot's lowest corner for a leg posed that way: how far it has risen off
// the floor (returned), and where it is along z relative to the hip (out.z).
// The foot box turns about its own centre, which hangs below the knee.
function footContact(ent, hip, knee, tilt, out) {
  var sa = Math.sin(hip + knee), ca = Math.cos(hip + knee);
  var sb = Math.sin(tilt), cb = Math.cos(tilt);
  var corner = (ent.toe * sb > ent.heel * sb) ? ent.toe : ent.heel;
  var y = -ent.thigh * Math.cos(hip) - ent.footY * ca - ent.footZ * sa
        - ent.half * cb - corner * sb;
  if (out) out.z = -ent.thigh * Math.sin(hip) - ent.footY * sa + ent.footZ * ca
                 - ent.half * sb + corner * cb;
  return y + ent.thigh + ent.footY + ent.half;
}

// The rig has no ankle: a foot is the lowest box hung from its knee. Find
// each one so the walk can keep it flat, measure the first leg, then walk
// it once on paper - through a full cycle, whichever corner is lowest is on
// the floor, and the body has to travel however far that corner slides back
// relative to the hip for it to stay put. The total is the ground a cycle
// covers, which is what lets the stride keep pace instead of skating.
function measureStride(ent) {
  var ud = ent.obj.userData;
  ent.stride = 0.05; ent.pace = 0; ent.cycle = 0;
  ent.thigh = ent.footY = ent.footZ = ent.half = ent.heel = ent.toe = 0;
  ent.gaitFeet = [];
  for (var j = 0; j < ud.legs.length; j++) {
    var knee = ud.legs[j].knee, best = null, depth = 0;
    if (knee) for (var c = 0; c < knee.children.length; c++) {
      var n = knee.children[c];
      if (!n.isMesh || n.geometry.type !== 'BoxGeometry') continue;
      var d = -n.position.y + n.geometry.parameters.height * 0.5 * n.scale.y;
      if (d > depth) { best = n; depth = d; }
    }
    ent.gaitFeet.push(best);
  }
  var leg = ud.legs[0], foot = ent.gaitFeet[0];
  if (leg && leg.knee && foot && leg.knee.parent === leg.hip) {
    var gp = foot.geometry.parameters;
    ent.thigh = -leg.knee.position.y;
    ent.footY = -foot.position.y;
    ent.footZ = foot.position.z;
    ent.half = gp.height * 0.5 * foot.scale.y;
    ent.heel = -gp.depth * 0.5 * foot.scale.z;
    ent.toe = gp.depth * 0.5 * foot.scale.z;
  }
  if (ent.half > 0) {
    var steps = 128, prevZ = 0, prevCorner = -1, out = {};
    for (var i = 0; i <= steps; i++) {
      var phase = Math.PI * 2 * i / steps, best2 = 1e9, zz = 0, corner = -1;
      for (var l = 0; l < 2; l++) {
        var sp = stridePose(phase + l * Math.PI, 1);
        var lift = footContact(ent, sp.hip, sp.knee, sp.tilt, out);
        if (lift < best2) {
          best2 = lift; zz = out.z;
          corner = l * 2 + (ent.toe * Math.sin(sp.tilt) > ent.heel * Math.sin(sp.tilt) ? 1 : 0);
        }
      }
      if (corner === prevCorner && prevZ > zz) ent.cycle += prevZ - zz;
      prevCorner = corner;
      prevZ = zz;
    }
  }
}
function swing(ent, amount, dur) {
  // wind up from wherever the arm is - a boss is already half there
  armInfo(ent);
  if (ent.obj.userData.armR) {
    var r = ent.obj.userData.armR;
    ent.swingFrom = [r.shoulder.rotation.x, r.elbow.rotation.x, armAim(ent)];
  }
  ent.atkAnim = dur || 0.3;
  ent.atkAnimDur = dur || 0.3;
  ent.atkSwing = amount || 1.4;
}
function flashModel(group, color) {
  var hits = [];
  group.traverse(function (o) {
    if (o.isMesh && o.material && o.material.color && !o.material.transparent) {
      hits.push({ m: o.material, c: o.material.color.getHex() });
    }
  });
  for (var i = 0; i < hits.length; i++) hits[i].m.color.setHex(color || 0xffffff);
  setTimeout(function () {
    for (var j = 0; j < hits.length; j++) hits[j].m.color.setHex(hits[j].c);
  }, 85);
}

// ---------- damage ----------
function hurtEnemy(e, dmg, opts) {
  opts = opts || {};
  if (!e.alive || e.dying) return;
  e.hp -= dmg;
  if (!opts.silent) {
    flashModel(e.obj, opts.crit ? 0xffe08a : 0xffffff);
    burst(e.obj.position.clone().setY(0.9), opts.crit ? 13 : 6,
      { type: e.gib, speed: opts.crit ? 3.2 : 2.2, size: 0.07, spread: 0.2 });
  }
  popNumber(e.obj.position, String(dmg), opts.crit ? 'crit' : (opts.dot || ''));
  if (opts.crit) shake(0.22);
  e.aggro = true;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.alive = false; e.dying = true;
  e.deathT = e.isBoss ? 1.8 : 0.75;
  e.deathDur = e.deathT;
  G.kills++;
  burst(e.obj.position.clone().setY(0.9), e.isBoss ? 60 : 24,
    { type: e.gib, speed: e.isBoss ? 5 : 3.4, size: 0.09, spread: 0.3, life: 0.9 });
  burst(e.obj.position.clone().setY(0.4), 12,
    { type: 'dust', speed: 1.6, size: 0.12, life: 0.8, grav: -1.5 });
  gainXp(e.xp);
  if (e.isBoss) {
    shake(1.0);
    shockwave(e.obj.position, 10, 0xffb070, 0.9);
    hitStop(0.12);
    G.boss = null;
    el.bossHud.style.display = 'none';
    schedule(1.9, onBossDefeated);
  } else {
    shake(0.2);
    hitStop(0.05);
    if (Math.random() < 0.3) spawnPickup(e.obj.position);
  }
}
function hurtPlayer(amount, isDot) {
  var p = G.player;
  if (!p.alive || G.transitioning) return;
  if (p.invuln > 0) { popNumber(p.obj.position, 'dodge', 'heal'); return; }
  var dmg = Math.max(1, Math.round(amount * (p.guard > 0 ? (1 - p.guardAmt) : 1)));
  p.hp -= dmg;
  popNumber(p.obj.position, String(dmg), 'hurt');
  if (!isDot) {
    burst(p.obj.position.clone().setY(1.0), 8, { type: 'blood', speed: 2.2, size: 0.07, spread: 0.2 });
    flash(el.hitFlash, 140);
    shake(0.3);
  }
  if (p.hp <= 0 && p.alive) {
    p.alive = false;
    burst(p.obj.position.clone().setY(0.9), 30, { type: 'blood', speed: 3.4, size: 0.09 });
    shake(0.9);
    endGame(true);
  }
}

// ---------- progression ----------
function gainXp(amount) {
  if (!amount) return;
  var p = G.player;
  p.xp += amount;
  popNumber(p.obj.position.clone().setY(0.5), '+' + amount + ' xp', 'xp');
  while (p.xp >= p.xpNext) {
    p.xp -= p.xpNext;
    p.level++;
    p.maxHp += G.clsDef.hpPerLv;
    p.hp = p.maxHp;
    p.maxRes += G.clsDef.resPerLv;
    p.res = p.maxRes;
    p.atk += G.clsDef.atkPerLv;
    p.xpNext = Math.round(p.xpNext * 1.55);
    burst(p.obj.position.clone().setY(0.4), 36,
      { type: 'gold', speed: 2.2, upMin: 3.5, upMax: 6, grav: -3, life: 1.1, size: 0.08, spread: 0.35 });
    shockwave(p.obj.position, 3.4, 0xffd76a);
    var unlocked = null;
    for (var i = 0; i < p.kit.length; i++) {
      if (p.kit[i].unlock === p.level) unlocked = p.kit[i].name;
    }
    showToast(unlocked ? ('Level ' + p.level + ' — ' + unlocked + ' unlocked') : ('Level ' + p.level));
    el.medal.style.transform = 'scale(1.35)';
    setTimeout(function () { el.medal.style.transform = 'scale(1)'; }, 220);
  }
}

// ---------- abilities ----------
function abilityReady(p, slot) {
  var a = slot === 0 ? p.clsDef.basic : p.kit[slot - 1];
  if (!a) return false;
  if (a.unlock && p.level < a.unlock) return false;
  if (p.cds[slot] > 0) return false;
  if (a.cost > p.res) return false;
  if (p.status.stun > 0) return false;
  return true;
}
function useAbility(slot) {
  if (!G.playing || !G.player.alive || G.transitioning) return;
  var p = G.player;
  var a = slot === 0 ? p.clsDef.basic : p.kit[slot - 1];
  if (!abilityReady(p, slot)) return;
  p.cds[slot] = a.cd;
  p.res -= a.cost;
  runAbility(a.kind, p);
}
function forwardVec(p) {
  return new THREE.Vector3(Math.sin(p.facing), 0, Math.cos(p.facing));
}
function runAbility(kind, p) {
  var pos = p.obj.position;
  var fwd = forwardVec(p);

  if (kind === 'cleave') {
    swing(p, 1.5, 0.3);
    meleeArc(pos, p.facing, 2.7, 2.0, 0xfff0c0);
    if (coneHit(pos, p.facing, 2.7, 2.0, p.atk)) shake(0.16);

  } else if (kind === 'bash') {
    swing(p, 1.2, 0.28);
    p.dash = { t: 0.2, dir: fwd.clone(), speed: 12, hits: [], dmg: 0 };
    meleeArc(pos, p.facing, 2.6, 1.5, 0x9fd8ff);
    coneHit(pos, p.facing, 2.6, 1.5, p.atk * 1.3, { stun: 1.4, knock: 1.1 });
    burst(pos.clone().setY(0.8), 14, { type: 'spark', speed: 2.6, size: 0.08, life: 0.5 });
    shake(0.3);

  } else if (kind === 'whirl') {
    for (var w = 0; w < 3; w++) {
      (function (n) {
        schedule(n * 0.19, function () {
          if (!p.alive) return;
          swing(p, 1.8, 0.2);
          meleeArc(p.obj.position, p.facing + n * 2.1, 3.3, 6.28, 0xffd9a0);
          damageArea(p.obj.position, 3.3, p.atk * 0.8, { knock: 0.35 });
          shake(0.2);
        });
      })(w);
    }

  } else if (kind === 'bulwark') {
    p.guard = 4.5; p.guardAmt = 0.65;
    var heal = Math.round(p.maxHp * 0.25);
    p.hp = Math.min(p.maxHp, p.hp + heal);
    popNumber(pos, '+' + heal, 'heal');
    shockwave(pos, 2.6, 0x9fd8ff, 0.6);
    burst(pos.clone().setY(0.6), 26, { type: 'heal', speed: 1.8, grav: 1, life: 0.9, size: 0.08 });
    flash(el.healFlash, 200);
    showToast('Bulwark');

  } else if (kind === 'bolt') {
    swing(p, 1.1, 0.26);
    spawnProjectile({
      pos: pos.clone().add(new THREE.Vector3(0, 1.1, 0)).addScaledVector(fwd, 0.7),
      dir: fwd, speed: 17, dmg: p.atk * 0.95, from: 'player',
      color: 0xffb04a, radius: 0.17, maxDist: 20, trail: 'fire'
    });

  } else if (kind === 'fireball') {
    swing(p, 1.3, 0.34);
    spawnProjectile({
      pos: pos.clone().add(new THREE.Vector3(0, 1.1, 0)).addScaledVector(fwd, 0.8),
      dir: fwd, speed: 12, dmg: p.atk * 1.5, from: 'player',
      color: 0xff6a12, radius: 0.3, maxDist: 22, trail: 'fire',
      burn: 4, splash: 2.7, splashDmg: p.atk * 0.9
    });
    shake(0.12);

  } else if (kind === 'nova') {
    shockwave(pos, 4.6, 0x9fdcff, 0.6);
    burst(pos.clone().setY(0.5), 40, { type: 'frost', speed: 4, size: 0.09, life: 0.8, grav: -2 });
    damageArea(pos, 4.4, p.atk * 0.9, { slow: 3.5, slowAmt: 0.55 });
    flash(el.coldFlash, 220);
    shake(0.35);

  } else if (kind === 'meteor') {
    var target = pos.clone().addScaledVector(fwd, 5.2);
    var mat = new THREE.MeshBasicMaterial({ color: 0xff6a22, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
    var mark = new THREE.Mesh(new THREE.RingGeometry(2.9, 3.4, 28), mat);
    mark.rotation.x = -Math.PI / 2;
    mark.position.set(target.x, 0.14, target.z);
    scene.add(mark);
    showToast('Meteor falling');
    schedule(0.95, function () {
      scene.remove(mark); mat.dispose(); mark.geometry.dispose();
      damageArea(target, 3.4, p.atk * 3.0, { burn: 5, burnDps: 7, knock: 1.2 });
      shockwave(target, 7, 0xff8a3a, 0.7);
      burst(target.clone().setY(0.4), 55, { type: 'fire', speed: 6, size: 0.12, life: 1.0, grav: -4 });
      burst(target.clone().setY(0.2), 25, { type: 'rock', speed: 4, size: 0.11, life: 0.9 });
      shake(0.9); hitStop(0.07);
    });

  } else if (kind === 'shot') {
    swing(p, 1.0, 0.24);
    spawnProjectile({
      pos: pos.clone().add(new THREE.Vector3(0, 1.05, 0)).addScaledVector(fwd, 0.7),
      dir: fwd, speed: 19, dmg: p.atk, from: 'player',
      color: 0xe8dfc2, radius: 0.13, maxDist: 22, trail: 'spark'
    });

  } else if (kind === 'volley') {
    swing(p, 1.2, 0.3);
    [-0.24, 0, 0.24].forEach(function (off) {
      var d = new THREE.Vector3(Math.sin(p.facing + off), 0, Math.cos(p.facing + off));
      spawnProjectile({
        pos: pos.clone().add(new THREE.Vector3(0, 1.05, 0)).addScaledVector(d, 0.7),
        dir: d, speed: 18, dmg: p.atk * 0.9, from: 'player',
        color: 0xbfe8a0, radius: 0.14, maxDist: 22, pierce: 2, trail: 'venom'
      });
    });
    shake(0.1);

  } else if (kind === 'dash') {
    p.dash = { t: 0.26, dir: fwd.clone(), speed: 17, hits: [], dmg: p.atk * 1.4 };
    p.invuln = Math.max(p.invuln, 0.42);
    burst(pos.clone().setY(0.7), 22, { type: 'soul', speed: 2.4, size: 0.08, life: 0.5, grav: -1 });
    shake(0.18);

  } else if (kind === 'trap') {
    spawnTrap(pos.clone(), p.atk * 1.5);
    burst(pos.clone().setY(0.3), 14, { type: 'venom', speed: 1.4, size: 0.07, life: 0.5 });
    showToast('Trap armed');
  }
}

// ---------- player ----------
function makePlayer(clsDef) {
  var obj = clsDef.model();
  scene.add(obj);
  var p = {
    obj: obj, clsDef: clsDef, kit: clsDef.abilities,
    hp: clsDef.hp, maxHp: clsDef.hp,
    res: clsDef.res, maxRes: clsDef.res,
    atk: clsDef.atk, speed: clsDef.speed, radius: clsDef.radius,
    level: 1, xp: 0, xpNext: 70,
    facing: 0, walkT: 0, floatT: 0, baseY: 0,
    atkAnim: 0, atkAnimDur: 0.3, atkSwing: 0,
    cds: [0, 0, 0, 0], invuln: 0, guard: 0, guardAmt: 0,
    dash: null, status: newStatus(), alive: true, hitR: 0.5
  };
  return p;
}
function updatePlayer(dt) {
  var p = G.player;
  if (!p.alive) return;
  tickStatus(p, dt, true);
  p.invuln = Math.max(0, p.invuln - dt);
  p.guard = Math.max(0, p.guard - dt);
  p.res = Math.min(p.maxRes, p.res + G.clsDef.resRegen * dt);
  for (var c = 0; c < 4; c++) p.cds[c] = Math.max(0, p.cds[c] - dt);

  var moving = false;
  if (p.dash) {
    p.dash.t -= dt;
    var step = p.dash.speed * dt;
    moveBody(p.obj, p.dash.dir.x * step, p.dash.dir.z * step, p.radius);
    burst(p.obj.position.clone().setY(0.6), 1, { type: 'soul', speed: 0.4, size: 0.07, life: 0.3, grav: 0 });
    if (p.dash.dmg > 0) {
      var near = enemiesInRadius(p.obj.position, 1.4);
      for (var i = 0; i < near.length; i++) {
        if (p.dash.hits.indexOf(near[i].id) === -1) {
          p.dash.hits.push(near[i].id);
          var roll = rollDamage(p.dash.dmg);
          hurtEnemy(near[i], roll.amount, { crit: roll.crit });
        }
      }
    }
    moving = true;
    if (p.dash.t <= 0) p.dash = null;
  } else if (p.status.stun <= 0) {
    var vx = joyVec.x, vz = joyVec.y;
    var mag = Math.hypot(vx, vz);
    if (mag > 0.06) {
      var nx = vx / mag, nz = vz / mag;
      var sp = p.speed * speedMult(p) * Math.min(1, mag * 1.4) * dt;
      moving = moveBody(p.obj, nx * sp, nz * sp, p.radius);
      p.facing = Math.atan2(nx, nz);
      p.obj.rotation.y = angleTo(p.obj.rotation.y, p.facing, dt * 14);
    }
  }

  animateActor(p, dt, moving);
  playerLight.position.set(p.obj.position.x, 2.4, p.obj.position.z + 0.3);
  playerLight.intensity = 1.5 + Math.sin(G.elapsed * 9) * 0.12;

  markExplored(p.obj.position.x, p.obj.position.z, 3);
  var room = roomAtWorld(p.obj.position.x, p.obj.position.z);
  if (room && room !== G.currentRoom) {
    G.currentRoom = room;
    revealRoom(room);
    if (!room.spawned) populateRoom(room);
  }
  if (portal && dist2D(p.obj.position, portal.pos) < 1.5) nextFloor();
}

// ---------- enemies ----------
var enemyId = 1;
function spawnEnemy(key, x, z, isBoss) {
  var def = isBoss ? BOSSES[key] : ENEMIES[key];
  var obj = def.model();
  obj.scale.setScalar(def.scale);
  obj.position.set(x, 0, z);
  scene.add(obj);
  var float = !!obj.userData.float;
  var e = {
    id: enemyId++, key: key, def: def, obj: obj, isBoss: !!isBoss,
    hp: def.hp, hpMax: def.hp, dmg: def.dmg, speed: def.speed, xp: def.xp,
    range: def.range, cd: def.cd, gib: def.gib, ai: def.ai || 'melee',
    keepAway: def.keepAway || 0, shot: def.shot || null, heavy: !!def.heavy,
    hitR: 0.45 * def.scale, baseY: float ? 0.45 : 0,
    active: false, alive: true, dying: false, deathT: 0, deathDur: 1,
    aggro: false, attackCd: rand(0.2, 1.0), walkT: rand(0, 6), floatT: rand(0, 6),
    atkAnim: 0, atkAnimDur: 0.3, atkSwing: 0, telegraphing: false,
    status: newStatus(), baseScale: def.scale,
    bossState: 'idle', bossTimer: rand(2, 3.5), pending: null, charge: null
  };
  obj.position.y = e.baseY;
  G.enemies.push(e);
  return e;
}

function populateRoom(room) {
  room.spawned = true;
  if (room.kind === 'boss') {
    var c = roomCenterWorld(room);
    var b = spawnEnemy(G.theme.boss, c.x, c.z - 1.5, true);
    b.active = true;
    G.boss = b;
    el.bossName.textContent = b.def.name;
    el.bossHud.style.display = 'block';
    el.bossBar.style.width = '100%';
    showBanner(G.theme.sub, b.def.name, 2600);
    shake(0.4);
    camZoom = 1.12;
    return;
  }
  var area = room.w * room.h;
  var count = clamp(Math.round(area / 17) + G.depth, 2, 5);
  for (var i = 0; i < count; i++) {
    var gx = randInt(room.x + 1, room.x + room.w - 2);
    var gy = randInt(room.y + 1, room.y + room.h - 2);
    var w = cellCenter(gx, gy);
    if (dist2D(w, G.player.obj.position) < 4) continue;
    spawnEnemy(choose(G.theme.enemies), w.x, w.z, false);
  }
}

function updateEnemies(dt) {
  var p = G.player;
  for (var i = G.enemies.length - 1; i >= 0; i--) {
    var e = G.enemies[i];

    if (e.dying) {
      e.deathT -= dt;
      var k = Math.max(0, e.deathT) / e.deathDur;
      e.obj.scale.setScalar(e.baseScale * Math.max(0.02, k));
      e.obj.position.y = e.baseY - 0.8 * (1 - k);
      e.obj.rotation.z = (1 - k) * 1.3;
      e.obj.rotation.y += dt * 2.5;
      if (e.deathT <= 0) { scene.remove(e.obj); G.enemies.splice(i, 1); }
      continue;
    }
    if (!e.alive) continue;
    if (!e.active) {
      // wake by proximity so a room is pulled in pieces, not all at once
      if (dist2D(e.obj.position, p.obj.position) < 11) e.active = true;
      else continue;
    }

    tickStatus(e, dt, false);
    e.attackCd -= dt;

    var d = dist2D(e.obj.position, p.obj.position);
    var stunned = e.status.stun > 0;
    var moving = false;

    if (e.isBoss) {
      moving = updateBoss(e, dt, d);
    } else if (!stunned && p.alive) {
      var want = e.ai === 'ranged' ? e.keepAway : e.range;
      if (d > want + 0.4) {
        moving = stepToward(e, p.obj.position, e.speed * speedMult(e) * dt);
      } else if (e.ai === 'ranged' && d < want - 1.2) {
        moving = stepToward(e, p.obj.position, -e.speed * 0.7 * speedMult(e) * dt);
      }
      faceTarget(e, p.obj.position, dt);

      if (e.attackCd <= 0 && d <= (e.ai === 'ranged' ? e.def.range : e.range + 0.25)) {
        e.attackCd = e.cd;
        swing(e, 1.4, 0.3);
        if (e.ai === 'ranged' && e.shot) {
          var dir = new THREE.Vector3(
            p.obj.position.x - e.obj.position.x, 0, p.obj.position.z - e.obj.position.z);
          spawnProjectile({
            pos: e.obj.position.clone().setY(e.baseY + 1.0).addScaledVector(dir.clone().normalize(), 0.6),
            dir: dir, speed: e.shot.speed, dmg: e.dmg, from: 'enemy',
            color: e.shot.color, radius: e.shot.radius, maxDist: 18,
            burn: e.shot.burn || 0, trail: e.gib === 'fire' ? 'fire' : 'soul'
          });
        } else {
          schedule(0.14, function (ent) {
            return function () {
              if (!ent.alive || !p.alive) return;
              if (dist2D(ent.obj.position, p.obj.position) <= ent.range + 0.7) {
                hurtPlayer(ent.dmg);
                if (ent.heavy) {
                  shockwave(ent.obj.position, 2.4, 0xff8a3a, 0.4);
                  shake(0.3);
                }
              }
            };
          }(e));
        }
      }
    }
    animateActor(e, dt, moving);
  }
}
function stepToward(e, target, amount) {
  var dx = target.x - e.obj.position.x, dz = target.z - e.obj.position.z;
  var len = Math.hypot(dx, dz) || 1;
  return moveBody(e.obj, dx / len * amount, dz / len * amount, e.hitR);
}
function faceTarget(e, target, dt) {
  var want = Math.atan2(target.x - e.obj.position.x, target.z - e.obj.position.z);
  e.obj.rotation.y = angleTo(e.obj.rotation.y, want, dt * 9);
}

// ---------- boss AI ----------
function updateBoss(e, dt, d) {
  var p = G.player;
  el.bossBar.style.width = Math.max(0, e.hp / e.hpMax * 100).toFixed(1) + '%';
  var moving = false;

  if (e.charge) {
    e.charge.t -= dt;
    var step = e.charge.speed * dt;
    moveBody(e.obj, e.charge.dir.x * step, e.charge.dir.z * step, e.hitR);
    burst(e.obj.position.clone().setY(0.3), 1,
      { type: e.key === 'warden' ? 'fire' : 'dust', speed: 0.8, size: 0.1, life: 0.4, grav: -1 });
    if (!e.charge.hit && dist2D(e.obj.position, p.obj.position) < e.hitR + 1.3) {
      e.charge.hit = true;
      hurtPlayer(e.dmg * 1.4);
      knockbackPlayer(e.obj.position, 1.6);
      shake(0.5);
    }
    if (e.charge.t <= 0) e.charge = null;
    return true;
  }

  if (e.bossState === 'telegraph') {
    e.bossTimer -= dt;
    e.telegraphing = true;
    // animateActor hauls the weapon up while e.telegraphing is set
    if (Math.random() < dt * 24) {
      burst(e.obj.position.clone().setY(0.25), 2,
        { type: 'dust', speed: 1.0, size: 0.09, life: 0.5, grav: -1.5, spread: 0.9 });
    }
    faceTarget(e, p.obj.position, dt * 0.5);
    if (e.bossTimer <= 0) {
      e.telegraphing = false;
      execBossAttack(e, e.pending.name);
      e.bossState = 'idle';
      e.bossTimer = rand(2.6, 4.2);
      e.pending = null;
    }
    return false;
  }

  // idle: close distance, basic swing, choose a special
  if (e.status.stun <= 0 && p.alive) {
    if (d > e.range) moving = stepToward(e, p.obj.position, e.speed * speedMult(e) * dt);
    faceTarget(e, p.obj.position, dt);
    if (e.attackCd <= 0 && d <= e.range + 0.4) {
      e.attackCd = e.cd;
      swing(e, 1.6, 0.32);
      schedule(0.16, function () {
        if (!e.alive || !p.alive) return;
        if (dist2D(e.obj.position, p.obj.position) <= e.range + 0.9) hurtPlayer(e.dmg);
      });
    }
    e.bossTimer -= dt;
    if (e.bossTimer <= 0 && d < 14) {
      var name = choose(e.def.attacks);
      e.pending = { name: name, tele: name === 'meteors' ? 1.0 : 0.8 };
      e.bossState = 'telegraph';
      e.bossTimer = e.pending.tele;
      showToast(bossTell(name));
    }
  }
  return moving;
}
function bossTell(name) {
  var m = {
    charge: 'It lowers its shoulder',
    cleave: 'It winds back',
    summon: 'It calls for the pack',
    slam: 'It raises both fists',
    shards: 'Bone splinters gather',
    stomp: 'The ground trembles',
    nova: 'Heat builds',
    meteors: 'The ceiling cracks'
  };
  return m[name] || 'It readies an attack';
}
function execBossAttack(e, name) {
  var p = G.player;
  var here = e.obj.position.clone();

  if (name === 'charge') {
    var dir = new THREE.Vector3(p.obj.position.x - here.x, 0, p.obj.position.z - here.z).normalize();
    e.charge = { t: 0.75, dir: dir, speed: 15, hit: false };
    shake(0.35);

  } else if (name === 'cleave') {
    meleeArc(here, e.obj.rotation.y, 4.0, 2.2, 0xff9a6a);
    if (dist2D(here, p.obj.position) < 4.0) { hurtPlayer(e.dmg * 1.3); knockbackPlayer(here, 1.2); }
    burst(here.clone().setY(0.6), 20, { type: 'dust', speed: 3, size: 0.1, life: 0.6 });
    shake(0.5);

  } else if (name === 'summon') {
    for (var i = 0; i < 3; i++) {
      var a = (i / 3) * Math.PI * 2;
      var sx = here.x + Math.cos(a) * 2.6, sz = here.z + Math.sin(a) * 2.6;
      if (!isWalkable(sx, sz, 0.5)) continue;
      var minion = spawnEnemy(choose(G.theme.enemies), sx, sz, false);
      minion.active = true;
      minion.xp = Math.round(minion.xp * 0.5);
      burst(new THREE.Vector3(sx, 0.4, sz), 16, { type: 'dust', speed: 2.4, size: 0.09, life: 0.6 });
    }
    showToast('Reinforcements!');

  } else if (name === 'slam') {
    shockwave(here, 9, 0xd8d2bd, 0.7);
    burst(here.clone().setY(0.2), 40, { type: 'rock', speed: 5, size: 0.11, life: 0.8 });
    if (dist2D(here, p.obj.position) < 5.5) { hurtPlayer(e.dmg * 1.5); knockbackPlayer(here, 2.0); }
    shake(0.9); hitStop(0.06);

  } else if (name === 'shards') {
    for (var s = 0; s < 8; s++) {
      var ang = (s / 8) * Math.PI * 2;
      spawnProjectile({
        pos: here.clone().setY(1.2),
        dir: new THREE.Vector3(Math.sin(ang), 0, Math.cos(ang)),
        speed: 10, dmg: e.dmg * 0.8, from: 'enemy',
        color: 0xe6e1cf, radius: 0.2, maxDist: 16, trail: 'bone'
      });
    }
    shake(0.3);

  } else if (name === 'stomp') {
    for (var k = 0; k < 3; k++) {
      (function (n) {
        schedule(n * 0.35, function () {
          if (!e.alive) return;
          var c = e.obj.position.clone();
          shockwave(c, 4 + n * 2.5, 0xd8d2bd, 0.5);
          var reach = 3 + n * 1.8;
          if (dist2D(c, p.obj.position) < reach) hurtPlayer(e.dmg * 0.7);
          shake(0.35);
        });
      })(k);
    }

  } else if (name === 'nova') {
    shockwave(here, 12, 0xff7a22, 0.8);
    burst(here.clone().setY(0.6), 60, { type: 'fire', speed: 7, size: 0.11, life: 0.9, grav: -3 });
    if (dist2D(here, p.obj.position) < 6.5) {
      hurtPlayer(e.dmg * 1.4);
      applyStatus(p, 'burn', 4, 5);
      knockbackPlayer(here, 1.4);
    }
    shake(0.8); hitStop(0.05);

  } else if (name === 'meteors') {
    for (var m = 0; m < 4; m++) {
      (function (n) {
        schedule(n * 0.55, function () {
          if (!e.alive || !p.alive) return;
          var target = p.obj.position.clone();
          var mat = new THREE.MeshBasicMaterial({ color: 0xff6a22, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
          var mark = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.7, 24), mat);
          mark.rotation.x = -Math.PI / 2;
          mark.position.set(target.x, 0.14, target.z);
          scene.add(mark);
          schedule(0.75, function () {
            scene.remove(mark); mat.dispose(); mark.geometry.dispose();
            shockwave(target, 5, 0xff8a3a, 0.5);
            burst(target.clone().setY(0.4), 34, { type: 'fire', speed: 5, size: 0.11, life: 0.8, grav: -3 });
            if (dist2D(target, p.obj.position) < 2.8) {
              hurtPlayer(e.dmg * 1.2);
              applyStatus(p, 'burn', 3, 4);
            }
            shake(0.5);
          });
        });
      })(m);
    }
  }
}
function knockbackPlayer(from, power) {
  var p = G.player;
  var dx = p.obj.position.x - from.x, dz = p.obj.position.z - from.z;
  var len = Math.hypot(dx, dz) || 1;
  moveBody(p.obj, dx / len * power, dz / len * power, p.radius);
}

// ---------- floors ----------
function buildFloor(depth) {
  G.depth = depth;
  G.theme = THEMES[Math.min(depth, THEMES.length - 1)];
  applyTheme(G.theme);
  disposeFloor();

  for (var i = 0; i < G.enemies.length; i++) scene.remove(G.enemies[i].obj);
  G.enemies = [];
  for (var j = 0; j < G.projectiles.length; j++) scene.remove(G.projectiles[j].obj);
  G.projectiles = [];
  for (var k = 0; k < G.traps.length; k++) { scene.remove(G.traps[k].mesh); G.traps[k].mat.dispose(); }
  G.traps = [];
  for (var m = 0; m < G.pickups.length; m++) scene.remove(G.pickups[m].obj);
  G.pickups = [];
  G.timers = [];
  G.boss = null;
  G.currentRoom = null;
  camZoom = 1;
  el.bossHud.style.display = 'none';

  generateLayout(depth);
  buildFloorGeometry(G.theme);

  var start = rooms[0];
  var c = roomCenterWorld(start);
  G.player.obj.position.set(c.x, 0, c.z);
  G.player.obj.rotation.y = 0;
  G.player.facing = 0;
  G.player.dash = null;
  G.player.status = newStatus();
  revealRoom(start);
  markExplored(c.x, c.z, 4);
  mmDirty = true;

  G.player.invuln = Math.max(G.player.invuln, 1.2);
  el.floorTag.textContent = G.theme.sub + ' · ' + G.theme.name;
  showBanner(G.theme.sub, G.theme.name, 2400);
  camera.position.set(c.x, 10.6, c.z + 6);
}
function onBossDefeated() {
  if (G.depth >= THEMES.length - 1) {
    endGame(false);
    return;
  }
  var bossRoom = null;
  for (var i = 0; i < rooms.length; i++) if (rooms[i].kind === 'boss') bossRoom = rooms[i];
  var c = bossRoom ? roomCenterWorld(bossRoom) : { x: 0, z: 0 };
  spawnPortal(c);
  camZoom = 1;
  showBanner('The way down opens', 'Step into the gate', 2600);
  mmDirty = true;
}
function nextFloor() {
  if (G.transitioning) return;
  G.transitioning = true;
  flash(el.coldFlash, 500);
  shake(0.3);
  schedule(0.35, function () {
    buildFloor(G.depth + 1);
    G.player.hp = Math.min(G.player.maxHp, G.player.hp + Math.round(G.player.maxHp * 0.4));
    G.transitioning = false;
  });
}

// ---------- HUD ----------
function updateHud() {
  var p = G.player;
  el.medal.textContent = String(p.level);
  var hpPct = clamp(p.hp / p.maxHp * 100, 0, 100).toFixed(1);
  el.hpFill.style.width = hpPct + '%';
  el.hpGhost.style.width = hpPct + '%';
  el.hpText.textContent = Math.max(0, Math.round(p.hp)) + ' / ' + p.maxHp;
  el.resFill.style.width = clamp(p.res / p.maxRes * 100, 0, 100).toFixed(1) + '%';
  el.resText.textContent = Math.round(p.res) + ' / ' + p.maxRes;
  el.xpFill.style.width = clamp(p.xp / p.xpNext * 100, 0, 100).toFixed(1) + '%';

  var slots = ['a1', 'a2', 'a3'];
  for (var i = 0; i < 3; i++) {
    var a = p.kit[i], node = el.btn[slots[i]], cdNode = el.cd[slots[i]];
    var locked = p.level < a.unlock;
    node.classList.toggle('locked', locked);
    el.lk[slots[i]].style.display = locked ? '' : 'none';
    node.classList.toggle('nores', !locked && p.res < a.cost);
    var pct = clamp(p.cds[i + 1] / a.cd, 0, 1);
    cdNode.style.clipPath = 'inset(' + (100 - pct * 100) + '% 0 0 0)';
  }
}

// ---------- lifecycle ----------
function buildClassCards() {
  el.classList.innerHTML = '';
  CLASSES.forEach(function (c) {
    var card = document.createElement('div');
    card.className = 'class-card';
    var kit = c.abilities.map(function (a) {
      return '<b>' + a.icon + ' ' + a.name + '</b> <span style="opacity:.7">Lv' + a.unlock + '</span>';
    }).join(' · ');
    card.innerHTML =
      '<div class="cc-head">' +
        '<div class="cc-orb" style="background:' + c.color + '"></div>' +
        '<div><div class="cc-name">' + c.name + '</div>' +
        '<div class="cc-role">' + c.role + '</div></div>' +
      '</div>' +
      '<div class="cc-desc">' + c.desc + '</div>' +
      '<div class="cc-kit">' + c.basic.icon + ' ' + c.basic.name + ' · ' + kit + '</div>';
    card.addEventListener('click', function () { startRun(c); });
    el.classList.appendChild(card);
  });
}
function startRun(clsDef) {
  el.screenClass.style.display = 'none';
  el.screenDead.style.display = 'none';
  el.screenWin.style.display = 'none';

  if (G.player && G.player.obj) scene.remove(G.player.obj);
  G.clsDef = clsDef;
  G.player = makePlayer(clsDef);
  G.kills = 0;
  G.transitioning = false;
  shakeAmt = 0; hitStopT = 0;

  el.resTag.textContent = clsDef.resName;
  el.ic.basic.textContent = clsDef.basic.icon;
  ['a1', 'a2', 'a3'].forEach(function (s, i) {
    el.ic[s].textContent = clsDef.abilities[i].icon;
    el.lk[s].textContent = 'Lv' + clsDef.abilities[i].unlock;
  });

  buildFloor(0);
  G.playing = true;
}
function endGame(dead) {
  G.playing = false;
  var scr = dead ? el.screenDead : el.screenWin;
  var stat = dead ? el.deadStats : el.winStats;
  var where = G.theme ? G.theme.name : 'the dark';
  stat.textContent = dead
    ? 'The ' + G.clsDef.name + ' fell in ' + where + ' at level ' + G.player.level +
      ', after ' + G.kills + ' kills.'
    : 'The ' + G.clsDef.name + ' walked out at level ' + G.player.level +
      ' with ' + G.kills + ' kills. All three floors are quiet.';
  scr.style.display = 'flex';
}

bindBtn(el.btn.basic, function () { useAbility(0); });
bindBtn(el.btn.a1, function () { useAbility(1); });
bindBtn(el.btn.a2, function () { useAbility(2); });
bindBtn(el.btn.a3, function () { useAbility(3); });
document.getElementById('btn-retry').addEventListener('click', function () {
  el.screenDead.style.display = 'none';
  el.screenClass.style.display = 'flex';
});
document.getElementById('btn-again').addEventListener('click', function () {
  el.screenWin.style.display = 'none';
  el.screenClass.style.display = 'flex';
});

// ---------- main loop ----------
var clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  var raw = Math.min(clock.getDelta(), 0.1);
  G.elapsed += raw;

  var dt = raw;
  if (hitStopT > 0) { hitStopT -= raw; dt = raw * 0.08; }

  if (G.playing && G.player) {
    updateTimers(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updateTraps(dt);
    updatePickups(dt);
    updatePortal(dt);
    updateHud();

    G.mmTimer -= raw;
    if (G.mmTimer <= 0) {
      G.mmTimer = 0.2;
      drawMinimap(G.player.obj.position, G.enemies);
    }
  }
  if (G.player) updateMotes(raw, G.player.obj.position, G.theme ? G.theme.torch : 0xffd9a0);
  updateParticles(dt);
  updateRings(dt);
  updateArcs(dt);
  updateAmbience(raw);
  updateNumbers(raw);
  if (G.player) updateCamera(raw, G.player.obj.position);
  renderer.render(scene, camera);
}
function updateAmbience(dt) {
  for (var i = 0; i < braziers.length; i++) {
    var b = braziers[i];
    b.phase += dt * (7 + i * 0.21);
    var f = 0.82 + Math.sin(b.phase) * 0.12 + Math.sin(b.phase * 2.7) * 0.07;
    b.flame.scale.set(f, 0.85 + f * 0.35, f);
    b.flame.rotation.y += dt * 3;
  }
  if (!G.player) return;
  var best = [null, null], bestD = [1e9, 1e9];
  for (var k = 0; k < braziers.length; k++) {
    var d = dist2D(braziers[k].pos, G.player.obj.position);
    if (d < bestD[0]) { bestD[1] = bestD[0]; best[1] = best[0]; bestD[0] = d; best[0] = braziers[k]; }
    else if (d < bestD[1]) { bestD[1] = d; best[1] = braziers[k]; }
  }
  for (var t = 0; t < torchLights.length; t++) {
    if (best[t] && bestD[t] < 16) {
      torchLights[t].position.set(best[t].pos.x, 2.1, best[t].pos.z);
      torchLights[t].intensity = (G.theme ? G.theme.torchI : 2) * (0.85 + Math.sin(best[t].phase) * 0.15);
    } else torchLights[t].intensity = 0;
  }
}

// ---------- boot ----------
initMotes();
buildClassCards();
onResize();
applyTheme(THEMES[0]);
camera.position.set(0, 11, 7);
tick();
// textures cost a few hundred ms to generate; build them just after the class
// screen has painted rather than blocking the first frame. buildSurfaces() is
// memoised, so an early "Descend" simply triggers it on demand instead.
setTimeout(buildSurfaces, 40);

})();

</script>
