<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dungeons of the Emberdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#06050a; overscroll-behavior:none; touch-action:none;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .tf { font-family:'Cinzel', Georgia, serif; }
  #game-root { position:relative; width:100%; height:100%; overflow:hidden; }
  #canvas-wrap { position:absolute; inset:0; }
  #canvas-wrap canvas { display:block; width:100%; height:100%; }

  #vignette { position:absolute; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(ellipse 76% 60% at 50% 46%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.52) 76%, rgba(0,0,0,0.86) 100%); }
  .flash { position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0; transition:opacity .16s ease-out; }
  #hit-flash { background:radial-gradient(ellipse 90% 70% at 50% 50%, rgba(150,10,10,0) 30%, rgba(175,15,15,.6) 100%); }
  #heal-flash { background:radial-gradient(ellipse 90% 70% at 50% 50%, rgba(40,200,110,0) 35%, rgba(50,210,120,.42) 100%); transition:opacity .3s; }
  #cold-flash { background:radial-gradient(ellipse 90% 70% at 50% 50%, rgba(80,170,255,0) 35%, rgba(90,180,255,.4) 100%); transition:opacity .3s; }

  #dmg-layer { position:absolute; inset:0; z-index:8; pointer-events:none; overflow:hidden; }
  .dmg { position:absolute; font-family:'Cinzel',Georgia,serif; font-weight:700; font-size:16px;
    color:#fff; text-shadow:0 2px 5px #000,0 0 10px rgba(0,0,0,.9); transform:translate(-50%,-50%);
    white-space:nowrap; opacity:0; }
  .dmg.crit { font-size:24px; color:#ffd24a; }
  .dmg.hurt { color:#ff6a5c; }
  .dmg.heal { color:#6ee89a; }
  .dmg.burn { color:#ff9a3c; font-size:14px; }
  .dmg.pois { color:#a8e05a; font-size:14px; }
  .dmg.xp   { color:#8fd0ff; font-size:13px; }

  /* HUD */
  #hud-top { position:absolute; top:0; left:0; right:0; z-index:10; padding:10px 12px 14px;
    color:#f0e6cd; pointer-events:none;
    background:linear-gradient(to bottom, rgba(4,3,8,.85), rgba(4,3,8,.2) 70%, rgba(4,3,8,0)); }
  .plate { display:flex; align-items:center; gap:9px; }
  #medal { width:40px; height:40px; flex-shrink:0; border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#6d5a2c,#2b2314); border:2px solid #c8a24e;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;
    color:#ffe9a8; text-shadow:0 1px 2px #000; box-shadow:0 0 10px rgba(200,162,78,.35);
    transition:transform .2s; }
  .bars { flex:1; min-width:0; }
  .bar-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .bar-tag { font-size:9px; letter-spacing:1.2px; width:24px; flex-shrink:0; color:#b9ac8d; text-shadow:0 1px 2px #000; }
  .bar-bg { position:relative; flex:1; height:11px; border-radius:3px; overflow:hidden;
    background:rgba(0,0,0,.7); border:1px solid rgba(200,178,128,.32); box-shadow:inset 0 1px 3px rgba(0,0,0,.9); }
  .bar-fill { position:absolute; inset:0; width:100%; transition:width .22s ease; }
  #hp-ghost { background:rgba(255,120,90,.35); transition:width .5s ease .12s; }
  #hp-fill { background:linear-gradient(180deg,#d4483a,#8d1f18); }
  #res-fill { background:linear-gradient(180deg,#57a8dd,#1d5a86); }
  #xp-fill  { background:linear-gradient(180deg,#c8a24e,#6b5220); }
  .bar-gloss { position:absolute; left:0; right:0; top:0; height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0)); }
  .bar-text { position:absolute; inset:0; text-align:center; font-size:9px; line-height:11px;
    color:#ffe4d6; text-shadow:0 1px 2px #000; letter-spacing:.4px; }

  #floor-tag { position:absolute; top:96px; left:12px; z-index:10; color:#c9b98f;
    font-size:10px; letter-spacing:2.4px; text-transform:uppercase; text-shadow:0 2px 5px #000; pointer-events:none; }

  #minimap-wrap { position:absolute; top:92px; right:12px; z-index:10; pointer-events:none;
    border:1px solid rgba(200,178,128,.35); border-radius:4px; overflow:hidden;
    background:rgba(6,5,10,.62); box-shadow:0 2px 10px rgba(0,0,0,.5); }
  #minimap { display:block; width:96px; height:96px; }

  #boss-hud { position:absolute; top:52px; left:50%; transform:translateX(-50%);
    width:84%; max-width:320px; z-index:10; text-align:center; color:#f0e6cd; display:none; }
  #boss-name { font-size:11px; letter-spacing:3px; text-transform:uppercase;
    text-shadow:0 2px 6px #000; margin-bottom:4px; color:#f0c9a0; }
  #boss-bar-bg { position:relative; height:12px; border-radius:3px; overflow:hidden;
    background:rgba(0,0,0,.75); border:1px solid rgba(214,120,90,.5); box-shadow:0 0 14px rgba(180,40,30,.35); }
  #boss-bar-fill { position:absolute; inset:0; width:100%;
    background:linear-gradient(180deg,#c0392b,#4d0d0d); transition:width .22s ease; }

  #toast { position:absolute; top:132px; left:50%; transform:translateX(-50%); z-index:15;
    color:#ffd76a; font-size:15px; font-weight:700; letter-spacing:1px;
    text-shadow:0 2px 8px #000,0 0 16px rgba(255,180,60,.5); opacity:0;
    transition:opacity .35s; pointer-events:none; white-space:nowrap; text-align:center; }

  #banner { position:absolute; top:38%; left:0; right:0; z-index:16; text-align:center;
    pointer-events:none; opacity:0; transition:opacity .6s; }
  #banner .b1 { font-size:13px; letter-spacing:5px; color:#c9a05e; text-transform:uppercase; }
  #banner .b2 { font-size:27px; letter-spacing:2px; color:#f2e2bd; text-shadow:0 4px 18px rgba(0,0,0,.9); margin-top:6px; }

  /* controls */
  #joystick-zone { position:absolute; left:16px; bottom:20px; width:116px; height:116px; z-index:10; touch-action:none; }
  #joystick-base { position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle,rgba(240,230,205,.09),rgba(240,230,205,.03));
    border:2px solid rgba(200,178,128,.3); box-shadow:inset 0 0 18px rgba(0,0,0,.5); }
  #joystick-knob { position:absolute; width:48px; height:48px; left:34px; top:34px; border-radius:50%;
    background:radial-gradient(circle at 36% 30%,rgba(240,230,205,.55),rgba(150,138,110,.4));
    border:1px solid rgba(240,230,205,.6); box-shadow:0 2px 8px rgba(0,0,0,.55); }

  #actions { position:absolute; right:12px; bottom:18px; z-index:10;
    display:grid; grid-template-columns:auto auto; gap:9px; align-items:end; justify-items:center; }
  .action-btn { position:relative; width:54px; height:54px; border-radius:50%;
    border:2px solid rgba(200,178,128,.4); display:flex; align-items:center; justify-content:center;
    font-size:21px; color:#fff; user-select:none; touch-action:none;
    box-shadow:0 3px 10px rgba(0,0,0,.5); transition:transform .08s ease; }
  .action-btn.press { transform:scale(.9); }
  .action-btn.locked { opacity:.3; }
  .action-btn.nores { opacity:.55; }
  #btn-basic { width:68px; height:68px; font-size:26px; grid-column:2; grid-row:2;
    background:radial-gradient(circle at 34% 28%,#9a9aa6,#2e2e36); }
  #btn-a1 { grid-column:1; grid-row:2; }
  #btn-a2 { grid-column:2; grid-row:1; }
  #btn-a3 { grid-column:1; grid-row:1; }
  .cd-overlay { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,.66);
    clip-path:inset(0 0 0 0); pointer-events:none; }
  .lock-lv { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel',Georgia,serif; font-size:10px; font-weight:700; color:#ffe9a8;
    text-shadow:0 1px 3px #000; pointer-events:none; }

  /* screens */
  .screen { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#f0e6cd; padding:20px;
    background:radial-gradient(ellipse at 50% 40%,rgba(20,12,10,.93),rgba(4,3,8,.98)); overflow-y:auto; }
  .screen h1 { font-size:26px; margin:0 0 4px; letter-spacing:2px; font-weight:700;
    color:#e8c98a; text-shadow:0 3px 14px rgba(200,120,40,.4); }
  .rule { width:130px; height:1px; margin:9px 0 14px;
    background:linear-gradient(90deg,transparent,#c8a24e,transparent); }
  .screen p { font-size:13px; line-height:1.6; max-width:300px; color:#bdb298; margin:4px 0; }
  .go-btn { margin-top:18px; padding:12px 28px; border-radius:6px; border:1px solid #d9a24e;
    background:linear-gradient(180deg,#8f2c22,#5d1a13); color:#f7ecd4; font-size:14px;
    font-weight:700; letter-spacing:1.5px; box-shadow:0 4px 16px rgba(0,0,0,.6); }
  .go-btn:active { transform:scale(.97); }

  .class-list { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; margin-top:6px; }
  .class-card { text-align:left; padding:11px 13px; border-radius:8px; border:1px solid rgba(200,178,128,.3);
    background:linear-gradient(180deg,rgba(40,32,26,.9),rgba(18,14,12,.9)); }
  .class-card:active { border-color:#d9a24e; }
  .cc-head { display:flex; align-items:center; gap:9px; }
  .cc-orb { width:32px; height:32px; border-radius:50%; flex-shrink:0; border:2px solid rgba(255,255,255,.25); }
  .cc-name { font-family:'Cinzel',Georgia,serif; font-size:16px; color:#f0dfb4; }
  .cc-role { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#9c9078; }
  .cc-desc { font-size:11.5px; color:#a89d86; margin-top:7px; line-height:1.5; }
  .cc-kit { font-size:11px; color:#c2b493; margin-top:6px; line-height:1.6; }
  .cc-kit b { color:#e8c98a; font-weight:600; }
</style>
</head>
<body>
<div id="game-root">
  <div id="canvas-wrap"></div>
  <div id="vignette"></div>
  <div class="flash" id="hit-flash"></div>
  <div class="flash" id="heal-flash"></div>
  <div class="flash" id="cold-flash"></div>
  <div id="dmg-layer"></div>

  <div id="hud-top">
    <div class="plate">
      <div id="medal" class="tf">1</div>
      <div class="bars">
        <div class="bar-row"><span class="bar-tag">HP</span>
          <div class="bar-bg">
            <div class="bar-fill" id="hp-ghost"></div><div class="bar-fill" id="hp-fill"></div>
            <div class="bar-gloss"></div><div class="bar-text" id="hp-text">30 / 30</div>
          </div></div>
        <div class="bar-row"><span class="bar-tag" id="res-tag">MP</span>
          <div class="bar-bg">
            <div class="bar-fill" id="res-fill"></div><div class="bar-gloss"></div>
            <div class="bar-text" id="res-text">50 / 50</div>
          </div></div>
        <div class="bar-row"><span class="bar-tag">XP</span>
          <div class="bar-bg"><div class="bar-fill" id="xp-fill" style="width:0%"></div><div class="bar-gloss"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="floor-tag"></div>
  <div id="minimap-wrap"><canvas id="minimap" width="192" height="192"></canvas></div>

  <div id="boss-hud">
    <div id="boss-name" class="tf">—</div>
    <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>
  </div>

  <div id="toast" class="tf"></div>
  <div id="banner" class="tf"><div class="b1" id="banner-1"></div><div class="b2" id="banner-2"></div></div>

  <div id="joystick-zone"><div id="joystick-base"></div><div id="joystick-knob"></div></div>

  <div id="actions">
    <div class="action-btn locked" id="btn-a3"><span id="ic-a3">✦</span>
      <div class="cd-overlay" id="cd-a3"></div><div class="lock-lv" id="lk-a3">5</div></div>
    <div class="action-btn locked" id="btn-a2"><span id="ic-a2">✦</span>
      <div class="cd-overlay" id="cd-a2"></div><div class="lock-lv" id="lk-a2">3</div></div>
    <div class="action-btn" id="btn-a1"><span id="ic-a1">✦</span>
      <div class="cd-overlay" id="cd-a1"></div><div class="lock-lv" id="lk-a1"></div></div>
    <div class="action-btn" id="btn-basic"><span id="ic-basic">⚔️</span></div>
  </div>

  <div class="screen" id="screen-class">
    <h1 class="tf">Dungeons of the Emberdeep</h1>
    <div class="rule"></div>
    <p>Three floors below. Choose who walks down.</p>
    <div class="class-list" id="class-list"></div>
  </div>

  <div class="screen" id="screen-dead" style="display:none;">
    <h1 class="tf">You Died</h1><div class="rule"></div>
    <p id="dead-stats"></p>
    <button class="go-btn tf" id="btn-retry">Descend again</button>
  </div>

  <div class="screen" id="screen-win" style="display:none;">
    <h1 class="tf">The Emberdeep Falls</h1><div class="rule"></div>
    <p id="win-stats"></p>
    <button class="go-btn tf" id="btn-again">Descend again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ===================================================================
//  PART 0 - TEXTURES
//  Every surface is generated in pixel loops at load: colour, normal
//  and roughness all come off one shared height field, so the relief,
//  the shading and the gloss agree with each other.
// ===================================================================

var TEX_WORLD = 256;   // floors and walls are seen up close
var TEX_ACTOR = 128;   // bodies are smaller on screen

function cl01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

function makeCanvas(size) {
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  return c;
}

// integer hash - far cheaper than the trig hash it replaces
function ihash(x, y, s) {
  var h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function smooth5(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

// periodic value noise, so every texture tiles without a visible seam
function pnoise(x, y, per, seed) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var p = Math.max(1, Math.round(per));
  var x0 = ((xi % p) + p) % p, x1 = ((xi + 1) % p + p) % p;
  var y0 = ((yi % p) + p) % p, y1 = ((yi + 1) % p + p) % p;
  var u = smooth5(xf), v = smooth5(yf);
  var a = ihash(x0, y0, seed), b = ihash(x1, y0, seed);
  var c = ihash(x0, y1, seed), d = ihash(x1, y1, seed);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function pfbm(x, y, per, oct, seed) {
  var amp = 0.5, f = 1, sum = 0, norm = 0;
  for (var i = 0; i < oct; i++) {
    sum += pnoise(x * f, y * f, per * f, seed + i * 17) * amp;
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
// ridged noise reads as cracks and fractures
function pridge(x, y, per, oct, seed) {
  return 1 - Math.abs(pfbm(x, y, per, oct, seed) * 2 - 1);
}
// cellular noise: distance to the nearest scattered feature point
function worley(x, y, per, seed) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var p = Math.max(1, Math.round(per));
  var best = 9;
  for (var ox = -1; ox <= 1; ox++) {
    for (var oy = -1; oy <= 1; oy++) {
      var cx = xi + ox, cy = yi + oy;
      var wx = ((cx % p) + p) % p, wy = ((cy % p) + p) % p;
      var fx = cx + ihash(wx, wy, seed);
      var fy = cy + ihash(wx, wy, seed + 91);
      var dx = fx - x, dy = fy - y;
      var d = dx * dx + dy * dy;
      if (d < best) best = d;
    }
  }
  return cl01(Math.sqrt(best));
}

function finishTexture(canvas, isColor) {
  var t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (isColor) t.encoding = THREE.sRGBEncoding;
  try {
    if (renderer && renderer.capabilities && renderer.capabilities.getMaxAnisotropy) {
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    }
  } catch (e) { /* headless: leave the default */ }
  return t;
}

// spec: { height(u,v)->~0..1, shade(h,u,v,out), rough(h,u,v)->0..1, bump }
function buildSurface(size, spec) {
  var H = new Float32Array(size * size);
  var i, x, y, u, v;
  for (y = 0; y < size; y++) {
    for (x = 0; x < size; x++) {
      H[y * size + x] = spec.height(x / size, y / size);
    }
  }

  var colC = makeCanvas(size), colCtx = colC.getContext('2d');
  var colImg = colCtx.createImageData(size, size);
  var cd = colImg.data;
  var rghC = null, rghCtx = null, rghImg = null, rd = null;
  if (spec.rough) {
    rghC = makeCanvas(size);
    rghCtx = rghC.getContext('2d');
    rghImg = rghCtx.createImageData(size, size);
    rd = rghImg.data;
  }
  var out = [0, 0, 0];
  for (y = 0; y < size; y++) {
    for (x = 0; x < size; x++) {
      i = y * size + x;
      u = x / size; v = y / size;
      spec.shade(H[i], u, v, out);
      cd[i * 4] = out[0]; cd[i * 4 + 1] = out[1]; cd[i * 4 + 2] = out[2]; cd[i * 4 + 3] = 255;
      if (rd) {
        var r = Math.round(cl01(spec.rough(H[i], u, v)) * 255);
        rd[i * 4] = r; rd[i * 4 + 1] = r; rd[i * 4 + 2] = r; rd[i * 4 + 3] = 255;
      }
    }
  }
  colCtx.putImageData(colImg, 0, 0);
  if (rd) rghCtx.putImageData(rghImg, 0, 0);

  // normals straight off the shared height field (Sobel, wrapped)
  var nC = makeCanvas(size), nCtx = nC.getContext('2d');
  var nImg = nCtx.createImageData(size, size);
  var nd = nImg.data;
  var s = spec.bump === undefined ? 2.4 : spec.bump;
  function hAt(px, py) {
    return H[(((py % size) + size) % size) * size + (((px % size) + size) % size)];
  }
  for (y = 0; y < size; y++) {
    for (x = 0; x < size; x++) {
      var dx = (hAt(x + 1, y) - hAt(x - 1, y)) * s;
      var dy = (hAt(x, y + 1) - hAt(x, y - 1)) * s;
      var len = Math.sqrt(dx * dx + dy * dy + 1);
      i = (y * size + x) * 4;
      nd[i] = Math.round((-dx / len * 0.5 + 0.5) * 255);
      nd[i + 1] = Math.round((-dy / len * 0.5 + 0.5) * 255);
      nd[i + 2] = Math.round((1 / len * 0.5 + 0.5) * 255);
      nd[i + 3] = 255;
    }
  }
  nCtx.putImageData(nImg, 0, 0);

  return {
    map: finishTexture(colC, true),
    normalMap: finishTexture(nC, false),
    roughnessMap: rghC ? finishTexture(rghC, false) : null
  };
}

function tint(k, r, g, b, out) {
  out[0] = cl01(k * r / 255) * 255;
  out[1] = cl01(k * g / 255) * 255;
  out[2] = cl01(k * b / 255) * 255;
}

// ---------- recipes ----------
// All are near-white so the material's own colour does the tinting.

function stoneFloorSurface(seed) {
  return buildSurface(TEX_WORLD, {
    bump: 3.2,
    height: function (u, v) {
      var edge = Math.min(u, v, 1 - u, 1 - v);
      var grout = edge < 0.055 ? -0.9 * (1 - edge / 0.055) : 0;
      var slab = pfbm(u * 5, v * 5, 5, 4, seed) * 0.55;
      var grain = pfbm(u * 34, v * 34, 34, 2, seed + 5) * 0.13;
      var chip = (1 - worley(u * 7, v * 7, 7, seed + 11)) > 0.82 ? -0.28 : 0;
      var crack = pridge(u * 4, v * 4, 4, 3, seed + 23);
      crack = crack > 0.86 ? -(crack - 0.86) * 4.2 : 0;
      return grout + slab + grain + chip + crack;
    },
    shade: function (h, u, v, out) {
      var edge = Math.min(u, v, 1 - u, 1 - v);
      var k = 0.72 + h * 0.5;
      if (edge < 0.055) k *= 0.44;                 // grout line, plus trodden dirt
      if (h < -0.15) k *= 0.7;                     // crevices hold grime
      if (ihash((u * TEX_WORLD) | 0, (v * TEX_WORLD) | 0, seed + 3) > 0.986) k += 0.26;
      tint(k, 220, 214, 206, out);
    },
    rough: function (h, u, v) {
      var edge = Math.min(u, v, 1 - u, 1 - v);
      if (edge < 0.055) return 1.0;
      return 0.68 + (1 - cl01(h + 0.3)) * 0.3;
    }
  });
}

function masonrySurface(seed) {
  var ROWS = 5, COLS = 3;
  function brickOf(u, v) {
    var ry = Math.floor(v * ROWS);
    var off = (ry % 2) * 0.5;
    var t = u * COLS + off;
    return { rx: Math.floor(t), ry: ry, fx: t - Math.floor(t), fy: v * ROWS - ry };
  }
  return buildSurface(TEX_WORLD, {
    bump: 3.0,
    height: function (u, v) {
      var b = brickOf(u, v);
      var m = Math.min(b.fx, 1 - b.fx, b.fy, 1 - b.fy);
      var mortar = m < 0.06 ? -1.0 * (1 - m / 0.06) : 0;
      var face = pfbm(u * 10, v * 10, 10, 4, seed) * 0.5;
      var pit = (1 - worley(u * 12, v * 12, 12, seed + 7)) > 0.86 ? -0.3 : 0;
      return mortar + face + pit;
    },
    shade: function (h, u, v, out) {
      var b = brickOf(u, v);
      var m = Math.min(b.fx, 1 - b.fx, b.fy, 1 - b.fy);
      var tone = 0.86 + ihash(b.rx, b.ry, seed + 31) * 0.34;   // every block differs
      var streak = pfbm(u * 3, v * 14, 14, 2, seed + 41) * 0.16;
      var k = (0.6 + h * 0.55) * tone - streak;
      if (m < 0.06) k *= 0.52;
      tint(k, 218, 213, 208, out);
    },
    rough: function (h, u, v) {
      var b = brickOf(u, v);
      var m = Math.min(b.fx, 1 - b.fx, b.fy, 1 - b.fy);
      return m < 0.06 ? 1.0 : 0.8 + (1 - cl01(h + 0.4)) * 0.2;
    }
  });
}

function rockSurface(seed) {
  return buildSurface(TEX_ACTOR, {
    bump: 2.6,
    height: function (u, v) {
      var mass = pfbm(u * 6, v * 6, 6, 4, seed) * 0.8;
      var frac = pridge(u * 5, v * 5, 5, 3, seed + 9);
      return mass + (frac > 0.8 ? -(frac - 0.8) * 3.0 : 0);
    },
    shade: function (h, u, v, out) { tint(0.66 + h * 0.6, 216, 214, 214, out); },
    rough: function (h) { return 0.9 + (1 - cl01(h)) * 0.1; }
  });
}

function boneSurface(seed) {
  return buildSurface(TEX_ACTOR, {
    bump: 1.8,
    height: function (u, v) {
      var stri = pfbm(u * 3, v * 22, 22, 3, seed) * 0.6;       // lengthwise striation
      var pore = (1 - worley(u * 16, v * 16, 16, seed + 13)) > 0.8 ? -0.35 : 0;
      return stri + pore;
    },
    shade: function (h, u, v, out) {
      var k = 0.82 + h * 0.34;
      if (h < -0.1) k *= 0.78;
      tint(k, 232, 226, 205, out);
    },
    rough: function (h) { return 0.62 + (1 - cl01(h)) * 0.3; }
  });
}

function clothSurface(seed) {
  return buildSurface(TEX_ACTOR, {
    bump: 2.0,
    height: function (u, v) {
      var warp = Math.sin(u * Math.PI * 2 * 26) * 0.5 + 0.5;
      var weft = Math.sin(v * Math.PI * 2 * 26) * 0.5 + 0.5;
      var weave = warp * weft * 0.5;
      var fibre = pfbm(u * 30, v * 30, 30, 2, seed) * 0.28;
      var fold = pfbm(u * 3, v * 3, 3, 3, seed + 19) * 0.3;
      return weave + fibre + fold;
    },
    shade: function (h, u, v, out) { tint(0.74 + h * 0.42, 222, 218, 210, out); },
    rough: function (h) { return 0.88 + (1 - cl01(h)) * 0.12; }
  });
}

function leatherSurface(seed) {
  return buildSurface(TEX_ACTOR, {
    bump: 2.2,
    height: function (u, v) {
      var grain = worley(u * 14, v * 14, 14, seed) * 0.55;      // pebbled hide
      var crease = pridge(u * 4, v * 4, 4, 2, seed + 27);
      return grain + (crease > 0.84 ? -(crease - 0.84) * 2.4 : 0)
             + pfbm(u * 20, v * 20, 20, 2, seed + 5) * 0.16;
    },
    shade: function (h, u, v, out) { tint(0.66 + h * 0.5, 220, 210, 198, out); },
    rough: function (h) { return 0.74 + (1 - cl01(h)) * 0.24; }
  });
}

function metalSurface(seed) {
  return buildSurface(TEX_ACTOR, {
    bump: 1.3,
    height: function (u, v) {
      var brush = Math.sin(v * 260 + pfbm(u * 4, v * 4, 4, 2, seed) * 14);
      var scratch = brush > 0.94 ? -0.4 : 0;                    // fine brushed lines
      var pit = (1 - worley(u * 18, v * 18, 18, seed + 3)) > 0.9 ? -0.5 : 0;
      return scratch + pit + pfbm(u * 9, v * 9, 9, 3, seed + 7) * 0.3;
    },
    shade: function (h, u, v, out) {
      var k = 0.78 + h * 0.42;
      if (h < -0.2) k *= 0.72;                                  // pits read darker
      tint(k, 224, 226, 230, out);
    },
    rough: function (h) { return cl01(0.3 + (1 - cl01(h + 0.2)) * 0.55); }
  });
}

function woodSurface(seed) {
  return buildSurface(TEX_ACTOR, {
    bump: 2.0,
    height: function (u, v) {
      var rings = Math.abs(Math.sin((v * 9 + pfbm(u * 2, v * 2, 2, 2, seed) * 2.4) * Math.PI));
      var grain = pfbm(u * 4, v * 40, 40, 2, seed + 11) * 0.3;
      var knot = worley(u * 3, v * 3, 3, seed + 17) < 0.16 ? -0.4 : 0;
      return rings * 0.45 + grain + knot;
    },
    shade: function (h, u, v, out) { tint(0.62 + h * 0.55, 226, 205, 176, out); },
    rough: function (h) { return 0.82 + (1 - cl01(h)) * 0.16; }
  });
}

function skinSurface(seed, coarse) {
  var sc = coarse ? 26 : 40;
  return buildSurface(TEX_ACTOR, {
    bump: coarse ? 1.6 : 1.0,
    height: function (u, v) {
      var pore = (1 - worley(u * sc, v * sc, sc, seed)) * 0.3;
      var mottle = pfbm(u * 6, v * 6, 6, 3, seed + 9) * 0.6;
      return pore + mottle;
    },
    shade: function (h, u, v, out) {
      tint((coarse ? 0.72 : 0.8) + h * (coarse ? 0.46 : 0.34), 236, 222, 212, out);
    },
    rough: function (h) { return 0.7 + (1 - cl01(h)) * 0.25; }
  });
}

// ---------- shared surface set ----------
var SURF = null;
function buildSurfaces() {
  if (SURF) return SURF;
  SURF = {
    floorStone: stoneFloorSurface(101),
    wallMason:  masonrySurface(111),
    rock:       rockSurface(71),
    bone:       boneSurface(21),
    cloth:      clothSurface(31),
    leather:    leatherSurface(41),
    metal:      metalSurface(51),
    wood:       woodSurface(61),
    skin:       skinSurface(3, false),
    hide:       skinSurface(11, true)
  };
  return SURF;
}

// tinted material sharing one surface's full map set
function surfMat(surfKey, colorHex, rough, metal) {
  var s = buildSurfaces()[surfKey];
  var m = new THREE.MeshStandardMaterial({
    color: colorHex,
    map: s.map,
    normalMap: s.normalMap,
    roughness: rough === undefined ? 0.95 : rough,
    metalness: metal === undefined ? 0.04 : metal
  });
  if (s.roughnessMap) m.roughnessMap = s.roughnessMap;   // modulates the value above
  return m;
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function approach(cur, target, rate) {
  var d = target - cur;
  return Math.abs(d) < 1e-4 ? target : cur + d * clamp(rate, 0, 1);
}
function angleTo(cur, target, rate) {
  var d = Math.atan2(Math.sin(target - cur), Math.cos(target - cur));

}

  var dx = a.x - b.x, dz = a.z - b.z;

function updateParticles(dt) {

    p.mesh.position.addScaledVector(p.vel, dt);
    if (p.mesh.position.y < 0.05) {

    }
    p.mesh.rotation.x += p.spin * dt;
    p.mesh.rotation.y += p.spin * dt * 0.7;

  }

var rings = [];
var ringGeoCache = new THREE.RingGeometry(0.4, 0.62, 36);
function shockwave(pos, maxR, color, dur) {
  var mat = new THREE.MeshBasicMaterial({
    color: color === undefined ? 0xffb070 : color,
    transparent: true, opacity: 0.8, side: THREE.DoubleSide
  });
  var m = new THREE.Mesh(ringGeoCache, mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(pos.x, 0.14, pos.z);
  scene.add(m);
  rings.push({ mesh: m, t: 0, dur: dur || 0.55, maxR: maxR || 4, mat: mat });
}
function updateRings(dt) {
  for (var i = rings.length - 1; i >= 0; i--) {
    var s = rings[i];
    s.t += dt;
    var k = s.t / s.dur;
    if (k >= 1) {
      scene.remove(s.mesh); s.mat.dispose();
      rings.splice(i, 1);
      continue;
    }
    s.mesh.scale.setScalar(1 + k * s.maxR);
    s.mat.opacity = 0.8 * (1 - k);
  }
}

var joyZone = $('joystick-zone'), joyKnob = $('joystick-knob');

  joyKnob.style.top = (34 + dy) + 'px';
  joyVec.x = dx / JOY_R; joyVec.y = dy / JOY_R;
}

}
joyZone.addEventListener('touchstart', function (e) {
  e.preventDefault();
  var t = e.changedTouches[0];
  joyId = t.identifier; setJoy(t.clientX, t.clientY);
}, { passive: false });
joyZone.addEventListener('touchmove', function (e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier === joyId) setJoy(t.clientX, t.clientY);
  }
}, { passive: false });
window.addEventListener('touchend', function (e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joyId) { joyId = null; resetJoy(); }
  }
});
var mouseDown = false;
joyZone.addEventListener('mousedown', function (e) { mouseDown = true; setJoy(e.clientX, e.clientY); });
window.addEventListener('mousemove', function (e) { if (mouseDown) setJoy(e.clientX, e.clientY); });
window.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; resetJoy(); } });

function bindBtn(node, fn) {
  function press(e) {
    if (e && e.preventDefault) e.preventDefault();
    node.classList.add('press');
    setTimeout(function () { node.classList.remove('press'); }, 110);
    fn();
  }
  node.addEventListener('touchstart', press, { passive: false });
  node.addEventListener('mousedown', press);
}

// ---------- camera ----------
var camGoal = new THREE.Vector3(0, 11, 6.4);
var lookGoal = new THREE.Vector3();
var camZoom = 1;
function updateCamera(dt, target) {
  var z = camZoom;
  camGoal.set(target.x, 10.6 * z, target.z + 6.0 * z);
  camera.position.lerp(camGoal, 1 - Math.pow(0.0016, dt));
  if (shakeAmt > 0.001) {
    camera.position.x += rand(-1, 1) * shakeAmt * 0.42;
    camera.position.y += rand(-1, 1) * shakeAmt * 0.3;
    camera.position.z += rand(-1, 1) * shakeAmt * 0.28;
    shakeAmt *= Math.pow(0.02, dt);
  }
  lookGoal.set(target.x, 1.1, target.z - 3.2);
  camera.lookAt(lookGoal);
  dirLight.position.set(target.x + 6, 16, target.z + 7);
  dirLight.target.position.set(target.x, 0, target.z);
  dirLight.target.updateMatrixWorld();
}


// ===================================================================
//  PART 2 - DUNGEON: layout generation, geometry, collision, minimap
// ===================================================================

var grid = null;          // grid[gx][gy] : 0 solid, 1 room, 2 corridor
var explored = null;      // grid of booleans for the minimap
var rooms = [];           // {x,y,w,h,kind,cleared,spawned}
var floorGroup = null;    // everything belonging to the current floor
var floorMats = [];       // per-floor materials, disposed on rebuild
var floorGeos = [];       // per-floor geometries, disposed on rebuild
var braziers = [];
var portal = null;
var mmDirty = true;

function worldOf(g) { return (g - GRID / 2) * CELL; }
function gOf(wx) { return Math.floor(wx / CELL + GRID / 2 + 0.5); }
function cellCenter(gx, gy) { return { x: worldOf(gx), z: worldOf(gy) }; }

function cellFloor(gx, gy) {
  return gx >= 0 && gy >= 0 && gx < GRID && gy < GRID && grid[gx][gy] > 0;
}
function isWalkable(x, z, r) {
  return cellFloor(gOf(x - r), gOf(z - r)) &&
         cellFloor(gOf(x + r), gOf(z - r)) &&
         cellFloor(gOf(x - r), gOf(z + r)) &&
         cellFloor(gOf(x + r), gOf(z + r));
}
// axis-separated movement so bodies slide along walls instead of sticking
function moveBody(obj, dx, dz, r) {
  var moved = false;
  if (dx !== 0 && isWalkable(obj.position.x + dx, obj.position.z, r)) { obj.position.x += dx; moved = true; }
  if (dz !== 0 && isWalkable(obj.position.x, obj.position.z + dz, r)) { obj.position.z += dz; moved = true; }
  return moved;
}

function roomAtWorld(x, z) {
  var gx = gOf(x), gy = gOf(z);
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    if (gx >= r.x && gx < r.x + r.w && gy >= r.y && gy < r.y + r.h) return r;
  }
  return null;
}
function roomCenterWorld(r) {
  return { x: worldOf(r.x + (r.w - 1) / 2), z: worldOf(r.y + (r.h - 1) / 2) };
}

// ---------- layout generation ----------
function generateLayout(depth) {
  grid = [];
  explored = [];
  for (var x = 0; x < GRID; x++) {
    grid[x] = []; explored[x] = [];
    for (var y = 0; y < GRID; y++) { grid[x][y] = 0; explored[x][y] = false; }
  }
  rooms = [];

  var want = 6 + Math.min(2, depth);
  var pad = 2;

  function overlaps(r) {
    for (var i = 0; i < rooms.length; i++) {
      var o = rooms[i];
      if (r.x - pad < o.x + o.w && r.x + r.w + pad > o.x &&
          r.y - pad < o.y + o.h && r.y + r.h + pad > o.y) return true;
    }
    return false;
  }
  function tryPlace(minS, maxS, tries) {
    for (var t = 0; t < tries; t++) {
      var w = randInt(minS, maxS), h = randInt(minS, maxS);
      var r = {
        x: randInt(2, GRID - w - 3), y: randInt(2, GRID - h - 3),
        w: w, h: h, kind: 'normal', cleared: false, spawned: false
      };
      if (!overlaps(r)) return r;
    }
    return null;
  }

  var first = tryPlace(6, 8, 400);
  if (!first) first = { x: 4, y: 4, w: 6, h: 6, kind: 'normal', cleared: false, spawned: false };
  first.kind = 'start'; first.cleared = true; first.spawned = true;
  rooms.push(first);

  for (var i = 1; i < want; i++) {
    var last = i === want - 1;
    var r = tryPlace(last ? 9 : 5, last ? 11 : 9, 500);
    if (!r) continue;
    if (last) r.kind = 'boss';
    rooms.push(r);
  }
  // guarantee a boss room even if the final placement failed
  if (!rooms.some(function (r) { return r.kind === 'boss'; })) {
    rooms[rooms.length - 1].kind = 'boss';
  }

  for (var j = 0; j < rooms.length; j++) carveRoom(rooms[j]);
  for (var k = 1; k < rooms.length; k++) carveCorridor(rooms[k - 1], rooms[k]);

  return rooms;
}
function carveRoom(r) {
  for (var x = r.x; x < r.x + r.w; x++)
    for (var y = r.y; y < r.y + r.h; y++)
      if (x >= 0 && y >= 0 && x < GRID && y < GRID) grid[x][y] = 1;
}
function carveCorridor(a, b) {
  var ax = Math.floor(a.x + a.w / 2), ay = Math.floor(a.y + a.h / 2);
  var bx = Math.floor(b.x + b.w / 2), by = Math.floor(b.y + b.h / 2);
  var horizFirst = Math.random() < 0.5;
  function hLine(x0, x1, y) {
    var s = Math.min(x0, x1), e = Math.max(x0, x1);
    for (var x = s; x <= e; x++)
      for (var w = 0; w < 2; w++)
        if (x >= 0 && x < GRID && y + w >= 0 && y + w < GRID && grid[x][y + w] === 0) grid[x][y + w] = 2;
  }
  function vLine(y0, y1, x) {
    var s = Math.min(y0, y1), e = Math.max(y0, y1);
    for (var y = s; y <= e; y++)
      for (var w = 0; w < 2; w++)
        if (x + w >= 0 && x + w < GRID && y >= 0 && y < GRID && grid[x + w][y] === 0) grid[x + w][y] = 2;
  }
  if (horizFirst) { hLine(ax, bx, ay); vLine(ay, by, bx); }
  else { vLine(ay, by, ax); hLine(ax, bx, by); }
}

// ---------- geometry building ----------
function disposeFloor() {
  if (floorGroup) {
    scene.remove(floorGroup);
    floorGroup.traverse(function (o) {
      if (o.isMesh || o.isInstancedMesh) {
        if (o.geometry && floorGeos.indexOf(o.geometry) === -1) o.geometry.dispose();
      }
    });
  }
  for (var i = 0; i < floorMats.length; i++) floorMats[i].dispose();
  for (var j = 0; j < floorGeos.length; j++) floorGeos[j].dispose();
  floorMats = []; floorGeos = [];
  braziers = [];
  portal = null;
  floorGroup = new THREE.Group();
  scene.add(floorGroup);
}
function trackMat(m) { floorMats.push(m); return m; }
function trackGeo(g) { floorGeos.push(g); return g; }

function addInstanced(geo, mat, list, opts) {
  if (!list.length) return null;
  var im = new THREE.InstancedMesh(geo, mat, list.length);
  var d = new THREE.Object3D();
  for (var i = 0; i < list.length; i++) {
    var t = list[i];
    d.position.set(t.x, t.y, t.z);
    d.rotation.set(t.rx || 0, t.ry || 0, t.rz || 0);
    d.scale.set(t.sx === undefined ? 1 : t.sx, t.sy === undefined ? 1 : t.sy, t.sz === undefined ? 1 : t.sz);
    d.updateMatrix();
    im.setMatrixAt(i, d.matrix);
  }
  im.instanceMatrix.needsUpdate = true;
  im.receiveShadow = !(opts && opts.noReceive);
  im.castShadow = !!(opts && opts.cast);
  floorGroup.add(im);
  return im;
}

function themeMat(surfKey, colorHex, rough, metal) {
  var sf = buildSurfaces()[surfKey];
  return trackMat(new THREE.MeshStandardMaterial({
    color: colorHex, map: sf.map, normalMap: sf.normalMap, roughnessMap: sf.roughnessMap,
    roughness: rough === undefined ? 0.95 : rough,
    metalness: metal === undefined ? 0.03 : metal
  }));
}

function buildFloorGeometry(theme) {
  var baseMat = trackMat(new THREE.MeshLambertMaterial({ color: 0x0b0a0f }));
  var floorsA = [], floorsB = [], floorsC = [], wallsA = [], wallsB = [], trim = [];
  var baseList = [];

  for (var x = 0; x < GRID; x++) {
    for (var y = 0; y < GRID; y++) {
      var c = cellCenter(x, y);
      if (grid[x][y] > 0) {
        baseList.push({ x: c.x, y: 0.0, z: c.z, sx: CELL, sy: 0.04, sz: CELL });
        var roll = Math.random();
        var t = {
          x: c.x + rand(-0.02, 0.02), y: 0.05 + rand(0, 0.016), z: c.z + rand(-0.02, 0.02),
          ry: (Math.random() < 0.5 ? 0 : Math.PI / 2) + rand(-0.015, 0.015),
          sx: CELL - 0.1, sy: 1, sz: CELL - 0.1
        };
        if (grid[x][y] === 2) floorsB.push(t);
        else if (roll < 0.2) floorsC.push(t);
        else if (roll < 0.55) floorsB.push(t);
        else floorsA.push(t);
      } else {
        var touching = false;
        for (var ox = -1; ox <= 1 && !touching; ox++)
          for (var oy = -1; oy <= 1; oy++) {
            if (cellFloor(x + ox, y + oy)) { touching = true; break; }
          }
        if (touching) {
          // two stacked courses of masonry read better than one tall block
          for (var row = 0; row < 2; row++) {
            var w = {
              x: c.x + rand(-0.03, 0.03), y: 0.9 + row * 1.75, z: c.z + rand(-0.03, 0.03),
              ry: rand(-0.02, 0.02),
              sx: CELL + 0.04, sy: 1.75 + rand(-0.12, 0.12), sz: CELL + 0.04
            };
            (Math.random() < 0.45 ? wallsB : wallsA).push(w);
          }
          trim.push({ x: c.x, y: 2.86, z: c.z, sx: CELL + 0.22, sy: 0.2, sz: CELL + 0.22 });
        }
      }
    }
  }

  var slabGeo = trackGeo(new THREE.BoxGeometry(1, 1, 1));
  var tileGeo = trackGeo(new THREE.BoxGeometry(1, 0.08, 1));
  var wallGeo = trackGeo(new THREE.BoxGeometry(1, 1, 1));

  addInstanced(slabGeo, baseMat, baseList, { noReceive: true });
  addInstanced(tileGeo, themeMat('floorStone', theme.floorA), floorsA);
  addInstanced(tileGeo, themeMat('floorStone', theme.floorB), floorsB);
  addInstanced(tileGeo, themeMat('floorStone', theme.floorC), floorsC);
  addInstanced(wallGeo, themeMat('wallMason', theme.wallA), wallsA, { cast: true });
  addInstanced(wallGeo, themeMat('wallMason', theme.wallB), wallsB, { cast: true });
  addInstanced(wallGeo, themeMat('rock', theme.wallB, 1, 0), trim, { cast: true });

  buildArches(theme);
  buildRoomFeatures(theme);
  buildBraziers(theme);
  buildProps(theme);
}

// arched doorways wherever a corridor meets a room
function buildArches(theme) {
  var posts = [], lintels = [], keys = [];
  var used = {};
  for (var x = 1; x < GRID - 1; x++) {
    for (var y = 1; y < GRID - 1; y++) {
      if (grid[x][y] !== 2) continue;
      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var d = 0; d < dirs.length; d++) {
        var nx = x + dirs[d][0], ny = y + dirs[d][1];
        if (!cellFloor(nx, ny) || grid[nx][ny] !== 1) continue;
        var key = Math.floor(x / 3) + ':' + Math.floor(y / 3) + ':' + d;
        if (used[key]) continue;
        used[key] = true;
        var c = cellCenter(x, y);
        var horiz = dirs[d][0] !== 0;
        var px = horiz ? 0 : CELL * 0.72;
        var pz = horiz ? CELL * 0.72 : 0;
        posts.push({ x: c.x + px, y: 1.25, z: c.z + pz, sx: 0.34, sy: 2.5, sz: 0.34 });
        posts.push({ x: c.x - px, y: 1.25, z: c.z - pz, sx: 0.34, sy: 2.5, sz: 0.34 });
        lintels.push({ x: c.x, y: 2.62, z: c.z, ry: horiz ? Math.PI / 2 : 0,
                       sx: 0.36, sy: 0.34, sz: CELL * 1.75 });
        keys.push({ x: c.x, y: 2.92, z: c.z, ry: horiz ? Math.PI / 2 : 0, sx: 0.42, sy: 0.36, sz: 0.42 });
        break;
      }
    }
  }
  var g = trackGeo(new THREE.BoxGeometry(1, 1, 1));
  var m = themeMat('rock', theme.accent, 0.95, 0.02);
  addInstanced(g, m, posts, { cast: true });
  addInstanced(g, m, lintels, { cast: true });
  addInstanced(g, m, keys, { cast: true });
}

// daises, rune circles and banners for special rooms
function buildRoomFeatures(theme) {
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    var c = roomCenterWorld(r);
    if (r.kind === 'boss') {
      var dais = new THREE.Mesh(
        trackGeo(new THREE.CylinderGeometry(5.4, 5.9, 0.16, 32)),
        themeMat('floorStone', theme.floorC, 0.95, 0));
      dais.position.set(c.x, 0.1, c.z);
      dais.receiveShadow = true;
      floorGroup.add(dais);

      var rune = new THREE.Mesh(
        trackGeo(new THREE.RingGeometry(3.2, 3.7, 48)),
        trackMat(new THREE.MeshBasicMaterial({
          color: theme.torch, transparent: true, opacity: 0.45, side: THREE.DoubleSide })));
      rune.rotation.x = -Math.PI / 2;
      rune.position.set(c.x, 0.2, c.z);
      floorGroup.add(rune);

      var inner = new THREE.Mesh(
        trackGeo(new THREE.RingGeometry(1.5, 1.75, 32)),
        trackMat(new THREE.MeshBasicMaterial({
          color: theme.torch, transparent: true, opacity: 0.35, side: THREE.DoubleSide })));
      inner.rotation.x = -Math.PI / 2;
      inner.position.set(c.x, 0.2, c.z);
      floorGroup.add(inner);

      var bm = trackMat(new THREE.MeshStandardMaterial({
        color: theme.accent, roughness: 0.95, side: THREE.DoubleSide,
        map: buildSurfaces().cloth.map, normalMap: buildSurfaces().cloth.normalMap,
        roughnessMap: buildSurfaces().cloth.roughnessMap }));
      var bg = trackGeo(new THREE.PlaneGeometry(1.4, 2.8));
      for (var b = -1; b <= 1; b += 2) {
        var ban = new THREE.Mesh(bg, bm);
        ban.position.set(c.x + b * 3.0, 2.0, worldOf(r.y) - 0.4);
        floorGroup.add(ban);
      }
    } else if (r.kind === 'start') {
      var ring = new THREE.Mesh(
        trackGeo(new THREE.RingGeometry(1.6, 2.0, 28)),
        trackMat(new THREE.MeshBasicMaterial({
          color: theme.accent, transparent: true, opacity: 0.3, side: THREE.DoubleSide })));
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(c.x, 0.15, c.z);
      floorGroup.add(ring);
    }
  }
}

function buildBraziers(theme) {
  // static parts are instanced; only the flame stays an individual mesh so it
  // can flicker on its own timer
  var ironMat = themeMat('metal', 0x3a3a42, 0.55, 0.6);
  var flameMat = trackMat(new THREE.MeshBasicMaterial({ color: theme.torch }));
  var coalMat = trackMat(new THREE.MeshBasicMaterial({ color: theme.torch }));
  var flameGeo = trackGeo(new THREE.ConeGeometry(0.2, 0.75, 8));

  var feet = [], posts = [], bowls = [], rims = [], coals = [];
  var spotsAll = [];
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    var spots = [
      [r.x + 1, r.y + 1], [r.x + r.w - 2, r.y + 1],
      [r.x + 1, r.y + r.h - 2], [r.x + r.w - 2, r.y + r.h - 2]
    ];
    if (r.kind === 'boss') {
      spots.push([r.x + Math.floor(r.w / 2), r.y + 1]);
      spots.push([r.x + Math.floor(r.w / 2), r.y + r.h - 2]);
    }
    for (var s = 0; s < spots.length; s++) spotsAll.push(cellCenter(spots[s][0], spots[s][1]));
  }
  for (var k = 0; k < spotsAll.length; k++) {
    var c = spotsAll[k];
    feet.push({ x: c.x, y: 0.05, z: c.z });
    posts.push({ x: c.x, y: 0.8, z: c.z });
    bowls.push({ x: c.x, y: 1.66, z: c.z });
    rims.push({ x: c.x, y: 1.8, z: c.z, rx: Math.PI / 2 });
    coals.push({ x: c.x, y: 1.76, z: c.z, sy: 0.45 });

    var flame = new THREE.Mesh(flameGeo, flameMat);
    flame.position.set(c.x, 2.12, c.z);
    floorGroup.add(flame);
    braziers.push({ pos: new THREE.Vector3(c.x, 0, c.z), flame: flame, phase: rand(0, 6.28) });
  }
  addInstanced(trackGeo(new THREE.CylinderGeometry(0.22, 0.28, 0.1, 8)), ironMat, feet, { cast: true });
  addInstanced(trackGeo(new THREE.CylinderGeometry(0.06, 0.1, 1.6, 7)), ironMat, posts, { cast: true });
  addInstanced(trackGeo(new THREE.CylinderGeometry(0.3, 0.15, 0.28, 10)), ironMat, bowls, { cast: true });
  addInstanced(trackGeo(new THREE.TorusGeometry(0.3, 0.035, 5, 14)), ironMat, rims);
  addInstanced(trackGeo(new THREE.SphereGeometry(0.19, 8, 6)), coalMat, coals, { noReceive: true });
}

function buildProps(theme) {
  var roomCells = [];
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    for (var x = r.x + 1; x < r.x + r.w - 1; x++)
      for (var y = r.y + 1; y < r.y + r.h - 1; y++)
        if (cellFloor(x, y)) roomCells.push([x, y]);
  }
  if (!roomCells.length) return;
  var rubble = [], barrels = [], bands = [], crates = [], urns = [], spikes = [], bones = [], decal = [], glow = [];
  var n = Math.min(120, Math.floor(roomCells.length * 0.3));
  for (var k = 0; k < n; k++) {
    var c = choose(roomCells);
    var w = cellCenter(c[0], c[1]);
    var px = w.x + rand(-0.75, 0.75), pz = w.z + rand(-0.75, 0.75);
    var roll = Math.random();
    if (roll < 0.2) {
      rubble.push({ x: px, y: rand(0.1, 0.2), z: pz, rx: rand(0, 3), ry: rand(0, 3), rz: rand(0, 3),
                    sx: rand(0.12, 0.3), sy: rand(0.1, 0.26), sz: rand(0.12, 0.3) });
    } else if (roll < 0.32) {
      barrels.push({ x: px, y: 0.34, z: pz, ry: rand(0, 3) });
      bands.push({ x: px, y: 0.44, z: pz, rx: Math.PI / 2, ry: rand(0, 3) });
      bands.push({ x: px, y: 0.22, z: pz, rx: Math.PI / 2, ry: rand(0, 3) });
    } else if (roll < 0.42) {
      crates.push({ x: px, y: 0.28, z: pz, ry: rand(0, 3), sx: rand(0.85, 1.15), sy: 1, sz: rand(0.85, 1.15) });
    } else if (roll < 0.5) {
      urns.push({ x: px, y: 0.26, z: pz, ry: rand(0, 3), sx: 1, sy: rand(0.9, 1.3), sz: 1 });
    } else if (roll < 0.58) {
      spikes.push({ x: px, y: 0, z: pz, ry: rand(0, 3), sx: rand(0.6, 1.2), sy: rand(0.7, 1.6), sz: rand(0.6, 1.2) });
    } else if (roll < 0.72) {
      bones.push({ x: px, y: 0.1, z: pz, rx: Math.PI / 2, ry: rand(0, 3), rz: rand(0, 3),
                   sx: 0.045, sy: rand(0.22, 0.46), sz: 0.045 });
    } else if (roll < 0.9) {
      decal.push({ x: px, y: 0.11, z: pz, rx: -Math.PI / 2, ry: rand(0, 3),
                   sx: rand(0.45, 1.35), sy: rand(0.45, 1.35), sz: 1 });
    } else {
      glow.push({ x: px, y: 0.12, z: pz, rx: -Math.PI / 2, ry: rand(0, 3),
                  sx: rand(0.35, 0.9), sy: rand(0.35, 0.9), sz: 1 });
    }
  }

  addInstanced(trackGeo(new THREE.DodecahedronGeometry(1, 0)),
    themeMat('rock', 0x554e58, 1, 0), rubble, { cast: true });
  addInstanced(trackGeo(new THREE.CylinderGeometry(0.29, 0.26, 0.66, 10)),
    themeMat('wood', 0x6a4a2c, 0.92, 0), barrels, { cast: true });
  addInstanced(trackGeo(new THREE.TorusGeometry(0.3, 0.026, 5, 12)),
    themeMat('metal', 0x4a4a52, 0.6, 0.5), bands);
  addInstanced(trackGeo(new THREE.BoxGeometry(0.56, 0.56, 0.56)),
    themeMat('wood', 0x7a5a34, 0.92, 0), crates, { cast: true });
  addInstanced(trackGeo(new THREE.SphereGeometry(0.26, 10, 8)),
    themeMat('rock', 0x7a6a58, 0.9, 0), urns, { cast: true });
  addInstanced(trackGeo(new THREE.ConeGeometry(0.24, 1.0, 7)),
    themeMat('rock', theme.wallA, 0.98, 0), spikes, { cast: true });
  addInstanced(trackGeo(new THREE.CylinderGeometry(1, 1, 1, 5)),
    themeMat('bone', 0xcfc8b2, 0.8, 0), bones, { cast: true });
  addInstanced(trackGeo(new THREE.CircleGeometry(1, 12)),
    trackMat(new THREE.MeshBasicMaterial({ color: theme.accent, transparent: true, opacity: 0.26 })),
    decal, { noReceive: true });
  addInstanced(trackGeo(new THREE.CircleGeometry(1, 10)),
    trackMat(new THREE.MeshBasicMaterial({ color: theme.torch, transparent: true, opacity: 0.3 })),
    glow, { noReceive: true });
}

// ---------- ambient motes ----------
var motes = [];
function initMotes() {
  if (motes.length) return;
  var geo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
  for (var i = 0; i < 46; i++) {
    var mat = new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.4 });
    var m = new THREE.Mesh(geo, mat);
    m.visible = false;
    scene.add(m);
    motes.push({ mesh: m, vy: rand(0.1, 0.35), drift: rand(-0.2, 0.2), life: 0 });
  }
}
function updateMotes(dt, center, color) {
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    m.life -= dt;
    if (m.life <= 0) {
      m.life = rand(3, 7);
      m.mesh.position.set(center.x + rand(-9, 9), rand(0.2, 2.6), center.z + rand(-9, 9));
      m.mesh.visible = true;
      m.vy = rand(0.1, 0.35);
      m.drift = rand(-0.2, 0.2);
      if (color !== undefined) m.mesh.material.color.setHex(color);
    }
    m.mesh.position.y += m.vy * dt;
    m.mesh.position.x += m.drift * dt;
    var d = Math.abs(m.mesh.position.x - center.x) + Math.abs(m.mesh.position.z - center.z);
    m.mesh.visible = d < 26;
  }
}

// ---------- portal ----------
function spawnPortal(pos) {
  var g = new THREE.Group();
  var ringMat = trackMat(new THREE.MeshBasicMaterial({ color: 0x8fd8ff, transparent: true, opacity: 0.9 }));
  var discMat = trackMat(new THREE.MeshBasicMaterial({ color: 0x2b6ea8, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
  var ring = new THREE.Mesh(trackGeo(new THREE.TorusGeometry(1.05, 0.11, 8, 28)), ringMat);
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.35;
  g.add(ring);
  var disc = new THREE.Mesh(trackGeo(new THREE.CircleGeometry(1.02, 26)), discMat);
  disc.rotation.x = -Math.PI / 2; disc.position.y = 0.33;
  g.add(disc);
  g.position.set(pos.x, 0, pos.z);
  floorGroup.add(g);
  portal = { group: g, ring: ring, pos: new THREE.Vector3(pos.x, 0, pos.z), t: 0 };
  var pl = new THREE.PointLight(0x6fc8ff, 2.2, 9, 2);
  pl.position.set(pos.x, 1.4, pos.z);
  g.add(pl);
}
function updatePortal(dt) {
  if (!portal) return;
  portal.t += dt;
  portal.ring.rotation.z += dt * 1.4;
  portal.group.position.y = Math.sin(portal.t * 2) * 0.08;
  if (Math.random() < dt * 22) {
    burst(portal.pos.clone().setY(0.4), 1,
      { type: 'frost', speed: 0.5, upMin: 1, upMax: 2.4, grav: 1.2, size: 0.07, life: 1.0, spread: 0.9 });
  }
}

// ---------- minimap ----------
function markExplored(wx, wz, radiusCells) {
  var gx = gOf(wx), gy = gOf(wz);
  for (var x = gx - radiusCells; x <= gx + radiusCells; x++) {
    for (var y = gy - radiusCells; y <= gy + radiusCells; y++) {
      if (x < 0 || y < 0 || x >= GRID || y >= GRID) continue;
      if (grid[x][y] > 0 && !explored[x][y]) { explored[x][y] = true; mmDirty = true; }
    }
  }
}
function revealRoom(r) {
  for (var x = r.x; x < r.x + r.w; x++)
    for (var y = r.y; y < r.y + r.h; y++)
      if (x >= 0 && y >= 0 && x < GRID && y < GRID && !explored[x][y]) { explored[x][y] = true; mmDirty = true; }
}
function drawMinimap(playerPos, enemyList) {
  var size = el.minimap.width;
  var s = size / GRID;
  mmCtx.clearRect(0, 0, size, size);
  mmCtx.fillStyle = 'rgba(10,9,14,0.55)';
  mmCtx.fillRect(0, 0, size, size);

  for (var x = 0; x < GRID; x++) {
    for (var y = 0; y < GRID; y++) {
      if (!explored[x][y]) continue;
      mmCtx.fillStyle = grid[x][y] === 2 ? '#3b3a44' : '#605945';
      mmCtx.fillRect(x * s, y * s, s + 0.6, s + 0.6);
    }
  }
  // boss room tint
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    if (r.kind !== 'boss' || !explored[r.x][r.y]) continue;
    mmCtx.fillStyle = 'rgba(200,50,40,0.34)';
    mmCtx.fillRect(r.x * s, r.y * s, r.w * s, r.h * s);
  }
  if (portal) {
    mmCtx.fillStyle = '#7fd8ff';
    mmCtx.fillRect(gOf(portal.pos.x) * s - 1, gOf(portal.pos.z) * s - 1, s + 2, s + 2);
  }
  for (var e = 0; e < enemyList.length; e++) {
    var en = enemyList[e];
    if (!en.alive || !en.active) continue;
    var ex = gOf(en.obj.position.x), ey = gOf(en.obj.position.z);
    if (ex < 0 || ey < 0 || ex >= GRID || ey >= GRID || !explored[ex][ey]) continue;
    mmCtx.fillStyle = en.isBoss ? '#ff5a3a' : '#d0564a';
    mmCtx.fillRect(ex * s - 0.5, ey * s - 0.5, s + 1, s + 1);
  }
  mmCtx.fillStyle = '#ffd76a';
  var px = gOf(playerPos.x) * s, py = gOf(playerPos.z) * s;
  mmCtx.beginPath();
  mmCtx.arc(px + s / 2, py + s / 2, s * 1.05, 0, Math.PI * 2);
  mmCtx.fill();
  mmDirty = false;
}

  var tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.15, 4), bm);
  tip.position.y = len + 0.18; g.add(tip);
  var guard = S(new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.045, 0.055), bm));

function makeStaff(len, woodHex, gemHex) {

  }
  var claw = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.026, 5, 12), wm);

  var gem = new THREE.Mesh(new THREE.IcosahedronGeometry(0.095, 0), new THREE.MeshBasicMaterial({ color: gemHex }));

}
function makeBow(size, woodHex) {
  var g = new THREE.Group();

  // behind it (it used to bow out sideways, clear of its own string)
  limb.rotation.set(0, Math.PI / 2, Math.PI / 2); g.add(limb);

function makeCleaver(len, bladeHex, gripHex) {

function makeGreatAxe(len, headHex, haftHex) {
  var g = new THREE.Group();

// ---------- jointed biped ----------
function buildBiped(cfg) {
  var outer = new THREE.Group();
  var body = new THREE.Group(); body.name = 'body';
  outer.add(body);

  var boxy = !!cfg.blocky;
  var skinM = cfg.skinSurf ? surfMat(cfg.skinSurf, cfg.skinColor, 0.75, 0) : surfMat('skin', cfg.skinColor, 0.75, 0);
  var clothM = surfMat(cfg.clothSurf || 'cloth', cfg.bodyColor, 0.9, 0);
  var trimM = surfMat(cfg.trimSurf || 'metal', cfg.trimColor, 0.5, cfg.trimMetal === undefined ? 0.55 : cfg.trimMetal);
  var leatherM = surfMat('leather', cfg.strapColor || 0x4a3524, 0.85, 0.05);

  function seg(len, rTop, rBot, mat) {
    return boxy
      ? new THREE.Mesh(new THREE.BoxGeometry(rTop * 2, len, rTop * 2), mat)
      : new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, len, 8), mat);
  }

  // ----- lower body -----
  var hipY = cfg.shinLen + cfg.thighLen;
  var pelvis = S(seg(cfg.pelvisH, cfg.hipR, cfg.hipR * 0.95, clothM));
  pelvis.position.y = hipY + cfg.pelvisH / 2;
  body.add(pelvis);

  var legs = [];
  [-1, 1].forEach(function (side, idx) {
    var hip = new THREE.Group();
    hip.name = 'leg' + idx + '_h';
    hip.position.set(side * cfg.hipR * 0.62, hipY, 0);
    var thigh = S(seg(cfg.thighLen, cfg.limbR * 1.15, cfg.limbR, clothM));
    thigh.position.y = -cfg.thighLen / 2;
    hip.add(thigh);
    if (!boxy) {
      var kneeCap = new THREE.Mesh(new THREE.SphereGeometry(cfg.limbR * 1.02, 7, 6), clothM);
      kneeCap.position.y = -cfg.thighLen;
      hip.add(kneeCap);
    }
    var knee = new THREE.Group();
    knee.name = 'leg' + idx + '_k';
    knee.position.y = -cfg.thighLen;
    var shin = S(seg(cfg.shinLen, cfg.limbR, cfg.limbR * 0.82, cfg.bootColor ? leatherM : clothM));
    shin.position.y = -cfg.shinLen / 2;
    knee.add(shin);
    var foot = S(new THREE.Mesh(
      new THREE.BoxGeometry(cfg.limbR * 2.1, cfg.limbR * 1.1, cfg.limbR * 3.2),
      cfg.bootColor ? surfMat('leather', cfg.bootColor, 0.85, 0.05) : leatherM));
    foot.position.set(0, -cfg.shinLen - cfg.limbR * 0.4, cfg.limbR * 0.75);
    knee.add(foot);
    hip.add(knee);
    body.add(hip);
    legs.push({ hip: hip, knee: knee });
  });

  // ----- torso -----
  var abdY = hipY + cfg.pelvisH;
  var abdomen = S(seg(cfg.abdomenH, cfg.chestR * 0.85, cfg.hipR, clothM));
  abdomen.position.y = abdY + cfg.abdomenH / 2;
  body.add(abdomen);

  var chest = new THREE.Group();
  chest.name = 'chest';
  chest.position.y = abdY + cfg.abdomenH;
  body.add(chest);

  var ribcage = S(seg(cfg.chestH, cfg.chestR * 0.92, cfg.chestR * 0.86, clothM));
  ribcage.position.y = cfg.chestH / 2;
  chest.add(ribcage);

  if (cfg.belt !== false) {
    var belt = new THREE.Mesh(
      new THREE.CylinderGeometry(cfg.hipR * 1.06, cfg.hipR * 1.06, cfg.pelvisH * 0.55, 10), leatherM);
    belt.position.y = abdY - cfg.pelvisH * 0.15;
    body.add(belt);
    var buckle = new THREE.Mesh(new THREE.BoxGeometry(cfg.hipR * 0.5, cfg.pelvisH * 0.5, 0.03), trimM);
    buckle.position.set(0, abdY - cfg.pelvisH * 0.15, cfg.hipR * 1.05);
    body.add(buckle);
  }
  if (cfg.chestPlate) {
    var plate = S(new THREE.Mesh(
      new THREE.CylinderGeometry(cfg.chestR * 0.98, cfg.chestR * 0.9, cfg.chestH * 0.82, 10, 1, true), trimM));
    plate.position.y = cfg.chestH * 0.48;
    chest.add(plate);
  }
  if (cfg.straps) {
    [-0.5, 0.5].forEach(function (a) {
      var st = new THREE.Mesh(new THREE.BoxGeometry(0.045, cfg.chestH * 1.05, 0.02), leatherM);
      st.position.set(0, cfg.chestH * 0.5, cfg.chestR * 0.88);
      st.rotation.z = a; chest.add(st);
    });
  }
  if (cfg.ribs) {
    for (var r = 0; r < 4; r++) {
      var rib = new THREE.Mesh(new THREE.TorusGeometry(cfg.chestR * 0.82, 0.018, 4, 12, Math.PI * 1.1), skinM);
      rib.position.y = cfg.chestH * (0.22 + r * 0.2);
      rib.rotation.y = Math.PI / 2; rib.rotation.z = Math.PI * 0.05;
      chest.add(rib);
    }
    var spine = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, cfg.chestH, 5), skinM);
    spine.position.set(0, cfg.chestH * 0.5, -cfg.chestR * 0.5);
    chest.add(spine);
  }

  // ----- head -----
  var neck = new THREE.Mesh(
    new THREE.CylinderGeometry(cfg.headR * 0.42, cfg.headR * 0.5, cfg.neckH, 7), skinM);
  neck.position.y = cfg.chestH + cfg.neckH / 2;
  chest.add(neck);

  var headPivot = new THREE.Group();
  headPivot.name = 'headPivot';
  headPivot.position.y = cfg.chestH + cfg.neckH;
  chest.add(headPivot);

  var skull = S(new THREE.Mesh(new THREE.SphereGeometry(cfg.headR, 14, 12), skinM));
  skull.position.y = cfg.headR * 0.82;
  skull.scale.set(0.92, 1.05, 1.0);
  headPivot.add(skull);

  var brow = new THREE.Mesh(
    new THREE.BoxGeometry(cfg.headR * 1.35, cfg.headR * 0.24, cfg.headR * 0.4), skinM);
  brow.position.set(0, cfg.headR * 1.0, cfg.headR * 0.72);
  headPivot.add(brow);

  var jaw = new THREE.Mesh(
    new THREE.BoxGeometry(cfg.headR * 1.05, cfg.headR * 0.44, cfg.headR * 0.9), skinM);
  jaw.position.set(0, cfg.headR * 0.42, cfg.headR * 0.3);
  headPivot.add(jaw);

  if (cfg.snout) {
    var snout = new THREE.Mesh(new THREE.ConeGeometry(cfg.headR * 0.34, cfg.headR * 0.85, 7), skinM);
    snout.position.set(0, cfg.headR * 0.78, cfg.headR * 0.78);
    snout.rotation.x = Math.PI / 2;
    headPivot.add(snout);
  } else {
    var nose = new THREE.Mesh(new THREE.ConeGeometry(cfg.headR * 0.16, cfg.headR * 0.4, 5), skinM);
    nose.position.set(0, cfg.headR * 0.8, cfg.headR * 0.85);
    nose.rotation.x = Math.PI / 2.1;
    headPivot.add(nose);
  }
  if (cfg.ears) {
    [-1, 1].forEach(function (s) {
      var ear = new THREE.Mesh(new THREE.ConeGeometry(cfg.headR * 0.3, cfg.headR * 1.05, 5), skinM);
      ear.position.set(s * cfg.headR * 0.9, cfg.headR * 1.1, -cfg.headR * 0.08);
      ear.rotation.z = s * 1.05; ear.rotation.x = -0.3;
      headPivot.add(ear);
    });
  }
  if (cfg.horns) {
    [-1, 1].forEach(function (s) {
      var horn = S(new THREE.Mesh(new THREE.ConeGeometry(cfg.headR * 0.17, cfg.headR * 1.15, 7), trimM));
      horn.position.set(s * cfg.headR * 0.62, cfg.headR * 1.55, 0);
      horn.rotation.z = s * 0.5; horn.rotation.x = -0.25;
      headPivot.add(horn);
    });
  }
  // eye sockets then eyes, so they read as set into the skull
  var socketM = new THREE.MeshStandardMaterial({ color: 0x14100f, roughness: 1 });
  var eyeM = new THREE.MeshBasicMaterial({ color: cfg.eyeColor === undefined ? 0x101014 : cfg.eyeColor });
  [-1, 1].forEach(function (s) {
    var sock = new THREE.Mesh(new THREE.SphereGeometry(cfg.headR * 0.24, 8, 7), socketM);
    sock.position.set(s * cfg.headR * 0.38, cfg.headR * 0.92, cfg.headR * 0.72);
    headPivot.add(sock);
    var eye = new THREE.Mesh(new THREE.SphereGeometry(cfg.headR * 0.13, 7, 6), eyeM);
    eye.position.set(s * cfg.headR * 0.38, cfg.headR * 0.92, cfg.headR * 0.82);
    headPivot.add(eye);
  });
  if (cfg.hair) {
    var hairM = surfMat('hide', cfg.hairColor, 0.95, 0);
    var cap = S(new THREE.Mesh(
      new THREE.SphereGeometry(cfg.headR * 1.04, 12, 9, 0, Math.PI * 2, 0, Math.PI * 0.58), hairM));
    cap.position.y = cfg.headR * 0.86;
    headPivot.add(cap);
  }
  if (cfg.beard) {
    var beardM = surfMat('hide', cfg.hairColor || 0x4a3524, 0.95, 0);
    var bd = new THREE.Mesh(new THREE.ConeGeometry(cfg.headR * 0.62, cfg.headR * 0.9, 8), beardM);
    bd.position.set(0, cfg.headR * 0.25, cfg.headR * 0.42);
    bd.rotation.x = 0.15;
    headPivot.add(bd);
  }
  if (cfg.helm) {
    var helm = S(new THREE.Mesh(
      new THREE.SphereGeometry(cfg.headR * 1.1, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.56), trimM));
    helm.position.y = cfg.headR * 0.88;
    headPivot.add(helm);
    var nasal = new THREE.Mesh(
      new THREE.BoxGeometry(cfg.headR * 0.16, cfg.headR * 0.8, 0.03), trimM);
    nasal.position.set(0, cfg.headR * 0.88, cfg.headR * 1.02);
    headPivot.add(nasal);
    var crest = S(new THREE.Mesh(
      new THREE.BoxGeometry(0.035, cfg.headR * 0.42, cfg.headR * 1.7), trimM));
    crest.position.y = cfg.headR * 1.42;
    headPivot.add(crest);
  }
  if (cfg.hood) {
    var hoodM = surfMat('cloth', cfg.hoodColor || cfg.bodyColor, 0.95, 0);
    var hood = S(new THREE.Mesh(new THREE.ConeGeometry(cfg.headR * 1.32, cfg.headR * 2.1, 9), hoodM));
    hood.position.y = cfg.headR * 1.0;
    hood.rotation.x = -0.08;
    headPivot.add(hood);
    var shade = new THREE.Mesh(new THREE.SphereGeometry(cfg.headR * 0.8, 9, 8),
      new THREE.MeshBasicMaterial({ color: 0x0b0910 }));
    shade.position.set(0, cfg.headR * 0.9, cfg.headR * 0.3);
    headPivot.add(shade);
  }

  // ----- arms -----
  var shoulderY = cfg.chestH * 0.92;
  function buildArm(side, idx) {
    var shoulder = new THREE.Group();
    shoulder.name = (side > 0 ? 'armR' : 'armL') + '_s';
    shoulder.position.set(side * cfg.chestR * 0.92, shoulderY, 0);

    var delt = S(new THREE.Mesh(new THREE.SphereGeometry(cfg.limbR * 1.22, 8, 7), clothM));
    shoulder.add(delt);
    var upper = S(seg(cfg.upperArm, cfg.limbR * 0.95, cfg.limbR * 0.8, clothM));
    upper.position.y = -cfg.upperArm / 2;
    shoulder.add(upper);

    var elbow = new THREE.Group();
    elbow.name = (side > 0 ? 'armR' : 'armL') + '_e';
    elbow.position.y = -cfg.upperArm;
    var elbowCap = new THREE.Mesh(new THREE.SphereGeometry(cfg.limbR * 0.86, 7, 6), clothM);
    elbow.add(elbowCap);
    var fore = S(seg(cfg.foreArm, cfg.limbR * 0.82, cfg.limbR * 0.66, cfg.bracers ? leatherM : clothM));
    fore.position.y = -cfg.foreArm / 2;
    elbow.add(fore);
    if (cfg.bracers) {
      var brac = new THREE.Mesh(
        new THREE.CylinderGeometry(cfg.limbR * 0.88, cfg.limbR * 0.8, cfg.foreArm * 0.5, 8), trimM);
      brac.position.y = -cfg.foreArm * 0.62;
      elbow.add(brac);
    }
    var hand = new THREE.Group();
    hand.name = (side > 0 ? 'armR' : 'armL') + '_h';
    hand.position.y = -cfg.foreArm;
    var palm = S(new THREE.Mesh(
      new THREE.BoxGeometry(cfg.limbR * 1.5, cfg.limbR * 1.6, cfg.limbR * 0.95), skinM));
    hand.add(palm);
    elbow.add(hand);
    shoulder.add(elbow);
    chest.add(shoulder);

    if (cfg.pauldrons) {
      var pa = S(new THREE.Mesh(
        new THREE.SphereGeometry(cfg.limbR * 1.95, 10, 7, 0, Math.PI * 2, 0, Math.PI * 0.62), trimM));
      pa.position.y = cfg.limbR * 0.35;
      shoulder.add(pa);
    }
    if (cfg.spikes) {
      var sp = S(new THREE.Mesh(new THREE.ConeGeometry(cfg.limbR * 0.62, cfg.limbR * 2.3, 6), trimM));
      sp.position.set(side * cfg.limbR * 1.1, cfg.limbR * 1.5, 0);
      sp.rotation.z = side * 0.6;
      shoulder.add(sp);
    }
    return { shoulder: shoulder, elbow: elbow, hand: hand };
  }
  var armR = buildArm(1, 0), armL = buildArm(-1, 1);

  if (cfg.weapon) {
    // weapons are built pointing up their +y with the edge (or axe head)
    // out along +x; a quarter turn about the shaft puts the edge forward,
    // leading the chop, instead of striking with the flat
    cfg.weapon.position.y = -cfg.limbR * 0.5;
    cfg.weapon.rotation.set(-0.22, -Math.PI / 2, 0);
    armR.hand.add(cfg.weapon);
  }
  if (cfg.offhand) {
    cfg.offhand.position.y = -cfg.limbR * 0.5;
    armL.hand.add(cfg.offhand);
  }
  if (cfg.shield) {
    var sh = new THREE.Group();
    var face = S(new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.045, 9), trimM));
    face.rotation.x = Math.PI / 2; sh.add(face);
    var rim = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.022, 5, 14), trimM);
    sh.add(rim);
    var bossPt = new THREE.Mesh(new THREE.SphereGeometry(0.062, 8, 7), trimM);
    bossPt.position.z = 0.045; sh.add(bossPt);
    sh.position.set(0, -cfg.limbR * 0.6, 0.12);
    armL.hand.add(sh);
  }

  var capes = [];
  if (cfg.cape) {
    var capeM = new THREE.MeshStandardMaterial({
      color: cfg.capeColor, roughness: 0.95, side: THREE.DoubleSide,
      map: buildSurfaces().cloth.map, normalMap: buildSurfaces().cloth.normalMap,
      roughnessMap: buildSurfaces().cloth.roughnessMap
    });
    var cape = S(new THREE.Mesh(
      new THREE.PlaneGeometry(cfg.chestR * 2.3, (cfg.chestH + cfg.abdomenH) * 1.35, 1, 3), capeM));
    cape.name = 'cape0';
    cape.position.set(0, -(cfg.chestH + cfg.abdomenH) * 0.28, -cfg.chestR * 0.95);
    cape.rotation.x = 0.1;
    chest.add(cape);
    capes.push(cape);
    var clasp = new THREE.Mesh(new THREE.BoxGeometry(cfg.chestR * 1.5, 0.05, 0.05), trimM);
    clasp.position.set(0, cfg.chestH * 0.9, -cfg.chestR * 0.55);
    chest.add(clasp);
  }

  outer.userData = {
    kind: 'biped', body: body, chest: chest, headPivot: headPivot,
    armR: armR, armL: armL, legs: legs, capes: capes, float: !!cfg.float

// ---------- prototype cache ----------
// Build each model once, then clone. Geometry and textures stay shared;
// materials are cloned per instance so a hit flash only affects one body.
var protoCache = {};
function instantiate(key, builder) {
  if (!protoCache[key]) {
    var built = builder();
    // Object3D.copy() deep-clones userData through JSON.stringify, which would
    // serialize every mesh and texture hanging off it. Park descriptor off to
    // the side so the clone only copies an empty object.
    built.__rig = built.userData;
    built.userData = {};
    protoCache[key] = built;
  }
  var proto = protoCache[key];
  var copy = proto.clone(true);
  // let bodies catch shadows from the world and from their own limbs
  copy.traverse(function (o) { if (o.isMesh) o.receiveShadow = true; });
  copy.traverse(function (o) {
    if (o.isMesh && o.material) {
      o.material = Array.isArray(o.material)
        ? o.material.map(function (m) { return m.clone(); })
        : o.material.clone();
    }
  });
  var ud = proto.__rig;
  function pick(name) { return name ? copy.getObjectByName(name) : null; }
  var legs = [];
  for (var i = 0; i < ud.legs.length; i++) {
    var L = { hip: pick('leg' + i + '_h'), knee: pick('leg' + i + '_k') };
    if (ud.legs[i].rest !== undefined) L.rest = ud.legs[i].rest;
    legs.push(L);
  }
  function armOf(tag) {
    if (!ud[tag]) return null;
    return { shoulder: pick(tag + '_s'), elbow: pick(tag + '_e'), hand: pick(tag + '_h') };
  }
  var wings = null;
  if (ud.wings) { wings = [pick('wing0'), pick('wing1')]; }
  copy.userData = {
    kind: ud.kind, body: pick('body'), chest: pick('chest'), headPivot: pick('headPivot'),
    armR: armOf('armR'), armL: armOf('armL'), legs: legs,
    capes: ud.capes.length ? [pick('cape0')] : [],
    float: ud.float, wings: wings, tail: pick('tail')
  };
  return copy;
}

var G = {
